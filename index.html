<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PrimeBudget</title>
  <meta name="description" content="PrimeBudget - application de gestion de budget intelligente, rapide et installable." />
  <meta name="theme-color" content="#07070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="PrimeBudget" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-title" content="PrimeBudget" />
  <meta name="apple-mobile-web-app-title" content="PrimeBudget" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-TileColor" content="#07070a" />
  <meta name="msapplication-TileImage" content="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="shortcut icon" type="image/png" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-analytics-compat.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

  <style>
    :root {
      --bg: #050508;
      --panel: #0d0d14;
      --panel2: #12121c;
      --panel3: #181826;
      --text: #f8fafc;
      --muted: #94a3b8;
      --soft: #64748b;
      --gold: #f5c84b;
      --gold2: #e0ab1f;
      --green: #10b981;
      --red: #f43f5e;
      --blue: #3b82f6;
      --purple: #8b5cf6;
      --line: rgba(255, 255, 255, 0.06);
      --line-bright: rgba(255, 255, 255, 0.12);
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      --radius: 20px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.2s, border-color 0.2s, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    }

    html, body, #root {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      letter-spacing: -0.01em;
    }

    /* Amélioration de l'ambiance lumineuse en arrière-plan */
    body:before {
      content: "";
      position: fixed;
      inset: -10%;
      background: 
        radial-gradient(circle at 15% 15%, rgba(245, 200, 75, 0.15), transparent 35%),
        radial-gradient(circle at 85% 25%, rgba(59, 130, 246, 0.12), transparent 40%),
        radial-gradient(circle at 50% 85%, rgba(16, 185, 129, 0.08), transparent 45%);
      filter: blur(40px);
      pointer-events: none;
      z-index: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { border: 0; color: inherit; cursor: pointer; background: none; }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.04);
      color: var(--text);
      border-radius: 14px;
      padding: 12px 16px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: rgba(245, 200, 75, 0.5);
      background: rgba(255, 255, 255, 0.07);
      box-shadow: 0 0 0 4px rgba(245, 200, 75, 0.1);
    }
    select option { background: #0d0d14; color: #fff; }

    .app {
      position: relative;
      height: 100%;
      display: grid;
      grid-template-columns: 280px 1fr;
      overflow: hidden;
      z-index: 1;
    }

    /* Barre latérale au style ultra-premium */
    .sidebar {
      padding: 24px;
      height: 100%;
      border-right: 1px solid var(--line);
      background: rgba(8, 8, 12, 0.65);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .brand { display: flex; align-items: center; gap: 14px; }
    .brand img {
      width: 42px;
      height: 42px;
      border-radius: 14px;
      box-shadow: 0 0 0 1px rgba(245, 200, 75, 0.3), 0 8px 24px rgba(245, 200, 75, 0.15);
    }
    .brand h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.04em; }
    .brand p { margin: 2px 0 0; color: var(--muted); font-size: 11px; font-weight: 500; }

    .nav { display: flex; flex-direction: column; gap: 6px; }
    .nav button {
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--muted);
      font-weight: 600;
      font-size: 14px;
      text-align: left;
    }
    .nav button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
    }
    .nav button.active {
      background: linear-gradient(135deg, rgba(245, 200, 75, 0.12), rgba(255, 255, 255, 0.02));
      color: #fff;
      box-shadow: inset 0 0 0 1px rgba(245, 200, 75, 0.2);
    }
    .nav ion-icon { font-size: 20px; color: var(--muted); }
    .nav button.active ion-icon, .nav button:hover ion-icon { color: var(--gold); }

    .sideCard {
      margin-top: auto;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.03);
      border-radius: 16px;
      padding: 16px;
    }

    .content {
      height: 100%;
      overflow: auto;
      padding: 32px 32px 120px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .title h2 { font-size: 32px; font-weight: 800; letter-spacing: -0.04em; margin: 0; }
    .title p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }

    .toolbar { display: flex; gap: 10px; align-items: center; flex-wrap:wrap; justify-content: flex-end; }

    /* Boutons et éléments interactifs */
    .btn {
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 700;
      font-size: 13.5px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--line);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text);
    }
    .btn:hover { background: rgba(255, 255, 255, 0.09); border-color: var(--line-bright); }
    .btn:active { transform: scale(0.97); }
    .btn.primary {
      background: linear-gradient(135deg, var(--gold), var(--gold2));
      color: #050508;
      border: 0;
      box-shadow: 0 12px 30px rgba(245, 200, 75, 0.2);
    }
    .btn.primary:hover { filter: brightness(1.1); }
    .btn.danger { color: var(--red); background: rgba(244, 63, 94, 0.1); border-color: rgba(244, 63, 94, 0.15); }
    .btn.danger:hover { background: rgba(244, 63, 94, 0.16); }

    .grid { display: grid; gap: 20px; }
    .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); margin-bottom: 24px; }

    /* Cartes KPI aux angles doux & dégradé néon discret */
    .card {
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.01));
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 20px;
      overflow: hidden;
      backdrop-filter: blur(10px);
    }
    .kpi { position: relative; min-height: 115px; display: flex; flex-direction: column; justify-content: center; }
    .kpi small { color: var(--muted); font-weight: 700; text-transform: uppercase; font-size: 11px; letter-spacing: 0.06em; }
    .kpi strong { display: block; font-size: 26px; font-family: 'JetBrains Mono', monospace; font-weight: 700; letter-spacing: -0.03em; margin-top: 8px; }
    .kpi span { color: var(--soft); font-size: 12px; margin-top: 4px; }
    .kpi ion-icon { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-size: 32px; opacity: 0.2; color: var(--text); }

    .mainGrid { grid-template-columns: 1.4fr 0.6fr; }
    .sectionTitle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 16px; }
    .sectionTitle h3 { margin: 0; font-size: 18px; font-weight: 700; }

    .chartBox { height: 300px; padding: 10px; }

    .tabs { display: flex; gap: 4px; background: rgba(0, 0, 0, 0.25); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
    .tabs button { border-radius: 8px; background: transparent; color: var(--muted); padding: 8px 12px; font-weight: 700; font-size: 13px; }
    .tabs button.active { background: rgba(255, 255, 255, 0.08); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

    .progress { height: 8px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; overflow: hidden; }
    .progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), var(--gold)); width: 0; }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .tx {
      display: grid; 
      grid-template-columns: auto 1fr auto auto; 
      gap: 14px; 
      align-items: center; 
      padding: 14px; 
      border-radius: 14px; 
      background: rgba(255, 255, 255, 0.02); 
      border: 1px solid var(--line);
    }
    .tx:hover { border-color: var(--line-bright); background: rgba(255, 255, 255, 0.04); }
    
    .txIcon { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.05); font-size: 18px; }
    .txTitle { font-weight: 700; font-size: 14.5px; }
    .txMeta { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .amount { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 15px; }

    .green { color: var(--green); }
    .red { color: var(--red); }
    .blue { color: var(--blue); }
    .gold { color: var(--gold); }

    /* Tableaux épurés et modernes */
    .tableWrap { overflow: auto; border-radius: 16px; border: 1px solid var(--line); background: rgba(0, 0, 0, 0.15); }
    table { width: 100%; border-collapse: collapse; min-width: 700px; }
    th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--line); }
    th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 700; background: rgba(255,255,255,0.01); }
    td { color: #e2e8f0; font-size: 14px; }
    tr:last-child td { border-bottom: 0; }

    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; background: rgba(255, 255, 255, 0.06); font-size: 11.5px; font-weight: 700; }

    .modal { position: fixed; inset: 0; z-index: 100; background: rgba(3, 3, 5, 0.8); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); display: grid; place-items: center; padding: 20px; }
    .modalBox { width: min(580px, 100%); max-height: 85vh; overflow: auto; background: var(--panel); border: 1px solid var(--line-bright); border-radius: 24px; box-shadow: 0 30px 70px rgba(0,0,0,0.8); padding: 24px; }
    .modalHead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modalHead h3 { margin: 0; font-size: 20px; font-weight: 800; }

    .formGrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 11px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }

    .catGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .catBtn { padding: 12px 8px; border-radius: 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: var(--muted); }
    .catBtn.active { background: rgba(245, 200, 75, 0.1); border-color: rgba(245, 200, 75, 0.4); color: #fff; }

    /* Scrollbars invisibles ou fines type macOS */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.25); }

    /* Responsive global & comportements Mobile */
    @media (max-width: 1050px) {
      .app { grid-template-columns: 1fr; }
      .sidebar { display: none; }
      .content { padding: calc(16px + var(--safe-top)) 16px 120px; }
      .kpis { grid-template-columns: repeat(2, 1fr); gap: 12px; }
      .mainGrid { grid-template-columns: 1fr; }
    }

    @media (max-width: 700px) {
      .kpis { grid-template-columns: 1fr; }
      .formGrid { grid-template-columns: 1fr; }
      .catGrid { grid-template-columns: repeat(2, 1fr); }
      .topbar { flex-direction: column; align-items: flex-start; }
      .toolbar { width: 100%; justify-content: space-between; }
      .toolbar .btn { flex: 1; }
    }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Simulation simplifiée des composants d'édition pour la cohérence structurelle
    function PaymentUseEditor({ editor, total, onClose, onSave }) {
      return (
        <div className="modal">
          <div className="modalBox">
            <div className="modalHead">
              <h3>Éditeur de Paiement</h3>
              <button className="btn" onClick={onClose}><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <p style={{ color: 'var(--muted)', fontSize: '14px' }}>Ajustement des critères de répartition du budget utilisable.</p>
            <button className="btn primary" style={{ width: '100%', marginTop: '12px' }} onClick={onClose}>Fermer</button>
          </div>
        </div>
      );
    }

    function PaymentHistoryModal({ uses, onClose, onEdit, onDelete }) {
      return (
        <div className="modal">
          <div className="modalBox">
            <div className="modalHead">
              <h3>Historique des utilisations</h3>
              <button className="btn" onClick={onClose}><ion-icon name="close-outline"></ion-icon></button>
            </div>
            <div className="list">
              <p style={{ color: 'var(--muted)', textAlign: 'center' }}>Aucun historique additionnel détecté.</p>
            </div>
          </div>
        </div>
      );
    }

    function AppDialog({ dialog, close }) {
      if (!dialog) return null;
      const icon = dialog.kind === 'danger' ? 'warning-outline' : dialog.kind === 'success' ? 'checkmark-circle-outline' : 'information-circle-outline';
      
      return (
        <div className="modal" onMouseDown={ev => { if (ev.target === ev.currentTarget) close(); }}>
          <div className="modalBox styleCard">
            <div className="modalHead">
              <h3 className={`dialogTitle ${dialog.kind || ''}`} style={{ display: 'flex', align-items: 'center', gap: '8px' }}>
                <ion-icon name={icon} style={{ color: dialog.kind === 'danger' ? 'var(--red)' : 'var(--gold)' }}></ion-icon>
                {dialog.title}
              </h3>
              <button className="btn" onClick={close}><ion-icon name="close-outline"></ion-icon></button>
            </div>
            {dialog.message && <p style={{ color: 'var(--muted)', fontSize: '14px', lineHeight: '1.5' }}>{dialog.message}</p>}
            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '10px', marginTop: '20px' }}>
              {(dialog.actions || []).map((action, i) => (
                <button key={i} className={`btn ${action.className || ''}`} onClick={action.onClick}>
                  {action.label}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // Composant principal de l'application Budget
    function App() {
      const [currentTab, setCurrentTab] = useState('dashboard');
      const [dialog, setDialog] = useState(null);

      return (
        <div className="app">
          {/* Sidebar de navigation gauche */}
          <div className="sidebar">
            <div className="brand">
              <img src="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" alt="Logo PrimeBudget" />
              <div>
                <h1>PrimeBudget</h1>
                <p>Gestion Intelligente</p>
              </div>
            </div>

            <div className="nav">
              <button className={currentTab === 'dashboard' ? 'active' : ''} onClick={() => setCurrentTab('dashboard')}>
                <ion-icon name="grid-outline"></ion-icon> Table de bord
              </button>
              <button className={currentTab === 'transactions' ? 'active' : ''} onClick={() => setCurrentTab('transactions')}>
                <ion-icon name="swap-horizontal-outline"></ion-icon> Transactions
              </button>
              <button className={currentTab === 'analytics' ? 'active' : ''} onClick={() => setCurrentTab('analytics')}>
                <ion-icon name="pie-chart-outline"></ion-icon> Analyses
              </button>
            </div>

            <div className="sideCard">
              <div style={{ fontSize: '12px', color: 'var(--muted)', fontWeight: 'bold' }}>VERSION ACTUELLE</div>
              <div style={{ fontSize: '14px', marginTop: '4px', fontFamily: 'monospace' }}>v2.4.0-premium</div>
            </div>
          </div>

          {/* Zone de contenu principale de l'application */}
          <div className="content">
            <div className="topbar">
              <div className="title">
                <h2>Aperçu Général</h2>
                <p>Suivi de vos flux financiers en temps réel.</p>
              </div>
              <div className="toolbar">
                <button className="btn primary" onClick={() => setDialog({
                  title: "Nouvelle transaction",
                  message: "Souhaitez-vous ajouter manuellement une écriture bancaire ou un flux de trésorerie ?",
                  kind: "success",
                  actions: [{ label: "Confirmer", className: "primary", onClick: () => setDialog(null) }]
                })}>
                  <ion-icon name="add-circle-outline"></ion-icon> Ajouter un flux
                </button>
              </div>
            </div>

            {/* Grille d'indicateurs clés (KPI) */}
            <div className="grid kpis">
              <div className="card kpi">
                <small>Solde Disponible</small>
                <strong className="green">5,439.50 €</strong>
                <span>Mise à jour en direct</span>
                <ion-icon name="wallet-outline"></ion-icon>
              </div>
              <div className="card kpi">
                <small>Économies Mensuelles</small>
                <strong className="gold">1,250.00 €</strong>
                <span>Objectif atteint à 82%</span>
                <ion-icon name="trending-up-outline"></ion-icon>
              </div>
              <div className="card kpi">
                <small>Dépenses Engagées</small>
                <strong className="red">640.22 €</strong>
                <span>Plafond global sécurisé</span>
                <ion-icon name="card-outline"></ion-icon>
              </div>
              <div className="card kpi">
                <small>Reste Utilisable</small>
                <strong>3,549.28 €</strong>
                <span>Allocation prédictive</span>
                <ion-icon name="calculator-outline"></ion-icon>
              </div>
            </div>

            {/* Vue principale (Tableau et flux récents) */}
            <div className="grid mainGrid">
              <div className="card">
                <div className="sectionTitle">
                  <h3>Flux Bancaires Récents</h3>
                  <div className="tabs">
                    <button className="active">Tous</button>
                    <button>Entrées</button>
                    <button>Sorties</button>
                  </div>
                </div>
                
                <div className="tableWrap">
                  <table>
                    <thead>
                      <tr>
                        <th>Intitulé / Libellé</th>
                        <th>Catégorie</th>
                        <th>Date de valeur</th>
                        <th>Montant total</th>
                      </tr>
                    </thead>
                    <tbody>
                      <tr>
                        <td><b>Virement Salaire Metallurgy</b><div style={{fontSize:'12px', color:'var(--muted)'}}>Métallurgie Entrée</div></td>
                        <td><span className="pill">Revenus</span></td>
                        <td>01 Juin 2026</td>
                        <td><span className="amount green">+2,450.00 €</span></td>
                      </tr>
                      <tr>
                        <td><b>Abonnement Serveur Cloud & PWA</b><div style={{fontSize:'12px', color:'var(--muted)'}}>Hébergement VPS Linode</div></td>
                        <td><span className="pill">Infrastructure</span></td>
                        <td>28 Mai 2026</td>
                        <td><span className="amount red">-45.90 €</span></td>
                      </tr>
                      <tr>
                        <td><b>Achat Pièces Auto Twingo 2</b><div style={{fontSize:'12px', color:'var(--muted)'}}>Disques & Plaquettes Brembo</div></td>
                        <td><span className="pill">Automobile</span></td>
                        <td>24 Mai 2026</td>
                        <td><span className="amount red">-112.50 €</span></td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Panneau latéral de progression */}
              <div className="card">
                <div className="sectionTitle">
                  <h3>Seuils d'Alerte</h3>
                </div>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', marginBottom: '6px' }}>
                      <span>Budget Logement / Atelier</span>
                      <span style={{ fontWeight: 'bold' }}>75%</span>
                    </div>
                    <div className="progress"><i style={{ width: '75%' }}></i></div>
                  </div>
                  <div>
                    <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', marginBottom: '6px' }}>
                      <span>Vie Quotidienne & Loisirs</span>
                      <span style={{ fontWeight: 'bold' }}>42%</span>
                    </div>
                    <div className="progress"><i style={{ width: '42%', background: 'var(--green)' }}></i></div>
                  </div>
                </div>
              </div>
            </div>

          </div>

          {/* Gestion globale des boîtes de dialogue et modals */}
          {dialog && <AppDialog dialog={dialog} close={() => setDialog(null)} />}
        </div>
      );
    }

    const root = ReactDom.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
