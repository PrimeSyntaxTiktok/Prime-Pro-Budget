<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PrimeBudget</title>
  <meta name="description" content="PrimeBudget - application de gestion de budget intelligente, rapide et installable." />
  <meta name="theme-color" content="#07070a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="PrimeBudget" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-title" content="PrimeBudget" />
  <meta name="apple-mobile-web-app-title" content="PrimeBudget" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-TileColor" content="#07070a" />
  <meta name="msapplication-TileImage" content="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="shortcut icon" type="image/png" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-analytics-compat.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <style>
    :root{
      /* Surfaces obsidiennes */
      --bg:#06060a;--bg2:#0a0a12;--panel:#101019;--panel2:#15151f;--panel3:#1c1c29;
      --text:#f6f7fb;--muted:#9a9bb0;--soft:#6f7088;
      /* Accents */
      --gold:#f6cf6b;--gold2:#d8a52f;--goldsoft:#fbe3a6;
      --green:#34e2a4;--red:#ff5573;--blue:#7fb4ff;--purple:#b29bff;
      --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.05);
      /* Mélanges */
      --glass:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.022));
      --glass-strong:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
      --gold-grad:linear-gradient(135deg,var(--goldsoft),var(--gold) 42%,var(--gold2));
      --shadow:0 30px 90px -30px rgba(0,0,0,.7);
      --shadow-sm:0 12px 34px -14px rgba(0,0,0,.6);
      --glow-gold:0 0 0 1px rgba(246,207,107,.35),0 20px 55px -18px rgba(246,207,107,.45);
      --radius:24px;--radius-sm:16px;
      --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
      --font-display:'Sora',system-ui,sans-serif;
      --font-body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
      --ease:cubic-bezier(.22,1,.36,1);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#root{height:100%;margin:0}
    body{
      font-family:var(--font-body);background:var(--bg);color:var(--text);
      overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      letter-spacing:-.01em;
    }
    /* Aurora vivante + lueurs profondes (sous le contenu) */
    body:before{
      content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
      background:
        radial-gradient(38% 42% at 18% 8%,rgba(246,207,107,.22),transparent 60%),
        radial-gradient(34% 40% at 92% 16%,rgba(127,180,255,.16),transparent 60%),
        radial-gradient(40% 44% at 78% 92%,rgba(52,226,164,.13),transparent 60%),
        radial-gradient(46% 50% at 30% 96%,rgba(178,155,255,.12),transparent 62%);
      filter:blur(28px);
      animation:auroraDrift 26s ease-in-out infinite alternate;
    }
    /* Trame fine + voile texturé */
    body:after{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
      background-image:
        linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(to bottom,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(circle at 50% 0%,#000,transparent 78%);
      -webkit-mask-image:radial-gradient(circle at 50% 0%,#000,transparent 78%);
    }

    button,input,select,textarea{font:inherit;font-family:var(--font-body)}
    button{border:0;color:inherit;cursor:pointer}
    input,select,textarea{
      width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);
      color:var(--text);border-radius:var(--radius-sm);padding:13px 14px;outline:none;
      transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);
    }
    input::placeholder,textarea::placeholder{color:var(--soft)}
    input:focus,select:focus,textarea:focus{
      border-color:rgba(246,207,107,.6);background:rgba(255,255,255,.06);
      box-shadow:0 0 0 4px rgba(246,207,107,.13),0 8px 30px -12px rgba(246,207,107,.4);
    }
    select option{background:#0e0e16;color:#fff}

    /* ============ Coque applicative ============ */
    .app{position:relative;height:100%;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
    .sidebar{
      padding:24px;height:100%;border-right:1px solid var(--line);
      background:linear-gradient(180deg,rgba(12,12,20,.82),rgba(8,8,14,.78));
      backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
      display:flex;flex-direction:column;gap:20px;position:relative;
    }
    .sidebar:after{content:"";position:absolute;top:0;right:0;width:1px;height:100%;
      background:linear-gradient(180deg,transparent,rgba(246,207,107,.35),transparent)}
    .brand{display:flex;align-items:center;gap:13px}
    .brand img{
      width:48px;height:48px;border-radius:16px;object-fit:cover;
      box-shadow:0 0 0 1px rgba(246,207,107,.5),0 14px 40px -10px rgba(246,207,107,.4);
    }
    .brand h1{margin:0;font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.04em}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:600}

    .nav{display:flex;flex-direction:column;gap:7px}
    .nav button{
      position:relative;background:transparent;border-radius:16px;padding:13px 15px;
      display:flex;align-items:center;gap:13px;color:var(--muted);font-weight:700;
      text-align:left;overflow:hidden;transition:color .25s var(--ease),background .3s var(--ease),transform .2s var(--ease);
    }
    .nav button:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);
      width:3px;height:60%;border-radius:0 4px 4px 0;background:var(--gold-grad);transition:transform .3s var(--ease)}
    .nav button.active,.nav button:hover{
      background:linear-gradient(135deg,rgba(246,207,107,.16),rgba(255,255,255,.035));color:#fff;
    }
    .nav button.active:before{transform:translateY(-50%) scaleY(1)}
    .nav button:hover{transform:translateX(2px)}
    .nav ion-icon{font-size:21px;color:var(--gold);transition:transform .25s var(--ease)}
    .nav button:hover ion-icon{transform:scale(1.12)}

    .sideCard{
      margin-top:auto;border:1px solid var(--line);background:var(--glass);
      border-radius:22px;padding:17px;position:relative;overflow:hidden;
    }
    .sideCard:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(160deg,rgba(246,207,107,.4),transparent 55%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .sideCard b{font-family:var(--font-display);font-weight:700}

    .content{height:100%;overflow:auto;padding:28px 30px 110px;scroll-behavior:smooth}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
    .title h2{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.05em;margin:0;
      background:linear-gradient(120deg,#fff,#cfd0df);-webkit-background-clip:text;background-clip:text;color:transparent}
    .title p{margin:8px 0 0;color:var(--muted)}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

    /* ============ Boutons ============ */
    .btn{
      position:relative;border-radius:var(--radius-sm);padding:12px 16px;font-weight:800;font-size:14px;
      background:var(--glass);border:1px solid var(--line);color:var(--text);
      display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;
      transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease);
    }
    .btn ion-icon{font-size:18px}
    .btn:hover{transform:translateY(-2px);background:var(--glass-strong);border-color:rgba(255,255,255,.16)}
    .btn:active{transform:translateY(0) scale(.98)}
    .btn.primary{
      background:var(--gold-grad);color:#120d02;border:0;
      box-shadow:var(--glow-gold);text-shadow:0 1px 0 rgba(255,255,255,.25);
    }
    .btn.primary:hover{box-shadow:0 0 0 1px rgba(246,207,107,.5),0 26px 60px -16px rgba(246,207,107,.6);filter:brightness(1.05)}
    .btn.danger{color:var(--red);background:rgba(255,85,115,.1);border-color:rgba(255,85,115,.25)}
    .btn.danger:hover{background:rgba(255,85,115,.16);border-color:rgba(255,85,115,.45)}
    .btn.ghost{background:rgba(255,255,255,.05);color:var(--text)}

    /* ============ Grilles & cartes ============ */
    .grid{display:grid;gap:16px}
    .kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
    .card{
      position:relative;border:1px solid var(--line);background:var(--glass);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;overflow:hidden;
      animation:rise .6s var(--ease) both;
    }
    .card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(150deg,rgba(255,255,255,.22),transparent 40%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .kpis .kpi:nth-child(1){animation-delay:.04s}
    .kpis .kpi:nth-child(2){animation-delay:.1s}
    .kpis .kpi:nth-child(3){animation-delay:.16s}
    .kpis .kpi:nth-child(4){animation-delay:.22s}

    .kpi{position:relative;min-height:128px;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
    .kpi:after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
      background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.7}
    .kpi:hover{transform:translateY(-4px);box-shadow:0 36px 80px -28px rgba(0,0,0,.8)}
    .kpi small{color:var(--muted);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.1em}
    .kpi strong{display:block;font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.045em;margin-top:11px}
    .kpi span{color:var(--muted);font-size:13px;font-weight:600}
    .kpi ion-icon{position:absolute;right:16px;top:16px;font-size:26px;opacity:.55;
      padding:9px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line)}

    .mainGrid{grid-template-columns:1.35fr .65fr}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
    .sectionTitle h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
    .chartBox{height:292px}

    .tabs{display:flex;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:5px}
    .tabs button{border-radius:13px;background:transparent;color:var(--muted);padding:10px 13px;font-weight:800;transition:all .25s var(--ease)}
    .tabs button.active{background:rgba(255,255,255,.1);color:#fff}

    .progress{height:11px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
    .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold));width:0;
      box-shadow:0 0 14px rgba(52,226,164,.5);transition:width .6s var(--ease)}

    /* ============ Listes & transactions ============ */
    .list{display:flex;flex-direction:column;gap:10px}
    .tx{
      display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:13px;
      border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
      user-select:none;touch-action:manipulation;transition:transform .2s var(--ease),background .25s var(--ease),border-color .25s var(--ease);
    }
    .tx:hover{background:rgba(255,255,255,.06);border-color:var(--line);transform:translateX(2px)}
    .tx.longPressing{border-color:rgba(255,85,115,.65);background:rgba(255,85,115,.1);transform:scale(.995)}
    .txIcon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .txTitle{font-weight:800}
    .txMeta{font-size:12px;color:var(--muted);margin-top:3px}
    .amount{font-family:var(--font-mono);font-weight:800;letter-spacing:-.02em}
    .green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.gold{color:var(--gold)}

    .tableWrap{overflow:auto;border-radius:20px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:15px;text-align:left;border-bottom:1px solid var(--line2)}
    th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    td{color:#e9e9f1}
    tbody tr{transition:background .2s var(--ease)}
    tbody tr:hover{background:rgba(255,255,255,.035)}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
      background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;font-weight:800}
    .pill ion-icon{font-size:15px}

    /* ============ FAB & navigation mobile ============ */
    .fab{
      display:none;position:fixed;right:18px;bottom:calc(82px + var(--safe-bottom));z-index:20;
      width:58px;height:58px;border-radius:22px;background:var(--gold-grad);color:#120d02;
      box-shadow:0 22px 60px -16px rgba(246,207,107,.6);font-size:28px;
      transition:transform .25s var(--ease);
    }
    .fab:before{content:"";position:absolute;inset:-6px;border-radius:26px;border:1px solid rgba(246,207,107,.4);
      animation:fabPulse 2.6s ease-out infinite}
    .fab:active{transform:scale(.92)}
    .bottomNav{display:none}

    /* ============ Modales ============ */
    .modal{position:fixed;inset:0;z-index:50;background:rgba(4,4,8,.66);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px;
      animation:fadeIn .25s var(--ease) both}
    .modalBox{
      position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;
      background:linear-gradient(180deg,rgba(22,22,32,.98),rgba(12,12,18,.98));
      border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:22px;
      animation:popIn .4s var(--ease) both;
    }
    .modalBox:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(150deg,rgba(246,207,107,.4),transparent 45%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .modalHead h3{margin:0;font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-.03em}
    .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .catGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .catBtn{padding:12px 8px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);
      display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--muted);
      transition:transform .2s var(--ease),background .25s var(--ease),border-color .25s var(--ease)}
    .catBtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.07)}
    .catBtn.active{background:rgba(246,207,107,.15);border-color:rgba(246,207,107,.5);color:#fff;box-shadow:0 0 0 1px rgba(246,207,107,.25)}
    .empty{text-align:center;color:var(--muted);padding:38px;font-weight:600}
    .installBanner{
      display:none;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;
      margin:-8px 0 18px;padding:13px 14px;border:1px solid rgba(246,207,107,.28);
      background:linear-gradient(135deg,rgba(246,207,107,.14),rgba(255,255,255,.03));border-radius:19px;
      box-shadow:var(--shadow-sm);
    }
    .installBanner b{font-family:var(--font-display)}
    .mini{font-size:12px;color:var(--muted)}
    .mobileDeleteHint{display:none;margin-top:10px;color:var(--muted);font-size:12px}
    .mobileOnly{display:none}

    /* ============ Scrollbars ============ */
    *{scrollbar-width:thin;scrollbar-color:rgba(246,207,107,.7) rgba(255,255,255,.05)}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:999px}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:999px;border:2px solid rgba(8,8,14,.9)}
    ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffe89a,var(--gold2))}
    ::-webkit-scrollbar-corner{background:transparent}

    /* ============ Dialogue ============ */
    .dialogBox{width:min(480px,100%);background:linear-gradient(180deg,rgba(30,30,44,.98),rgba(12,12,18,.98));border-color:rgba(246,207,107,.22)}
    .dialogTitle{display:flex;align-items:center;gap:10px;font-family:var(--font-display)}
    .dialogTitle ion-icon{font-size:24px;color:var(--gold)}
    .dialogTitle.danger ion-icon{color:var(--red)}.dialogTitle.success ion-icon{color:var(--green)}
    .dialogText{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
    .dialogActions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}
    .dialogActions .btn{min-width:118px}

    /* ============ Auth & synchronisation ============ */
    .authBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .authUser{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05);max-width:280px}
    .authUser img{width:28px;height:28px;border-radius:50%;object-fit:cover}
    .authUser span{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
    .googleBtn{min-width:112px;position:relative}
    .googleBtn.connected{background:rgba(52,226,164,.1);border-color:rgba(52,226,164,.3);color:#fff}
    .googleBtn .googleDot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px rgba(52,226,164,.15),0 0 12px rgba(52,226,164,.6)}
    .syncLine{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:8px;font-weight:600}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--soft);box-shadow:0 0 0 4px rgba(255,255,255,.035)}
    .dot.online{background:var(--green);box-shadow:0 0 0 4px rgba(52,226,164,.13),0 0 10px rgba(52,226,164,.6);animation:dotPulse 2.4s ease-in-out infinite}
    .dot.warn{background:var(--gold);box-shadow:0 0 0 4px rgba(246,207,107,.13)}
    .dot.err{background:var(--red);box-shadow:0 0 0 4px rgba(255,85,115,.13)}
    .syncCard{border:1px solid rgba(246,207,107,.2);background:rgba(246,207,107,.07);border-radius:20px;padding:14px}
    .smallGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
    .syncBadge{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:rgba(255,255,255,.05);border-radius:999px;padding:7px 11px;font-size:12px;font-weight:800;color:var(--muted)}

    /* ============ Panneau de partage ============ */
    .sharePanel{display:grid;gap:14px;margin-top:16px}

<div id="root"></div>
<script>
(async function(){
  const APP_NAME='PrimeBudget';
  const iconSource='https://i.ibb.co/zWQXGQK0/a471dbe4979d.png';
  const cleanUrl=location.href.split('#')[0];
  const currentUrl=cleanUrl.split('?')[0];
  const currentScope=currentUrl.slice(0,currentUrl.lastIndexOf('/')+1)||'./';

  const ensureLink=(rel,href,sizes='')=>{
    let el=document.head.querySelector(`link[rel="${rel}"]`);
    if(!el){el=document.createElement('link');el.rel=rel;document.head.appendChild(el)}
    if(sizes)el.sizes=sizes;
    el.href=href;
    return el;
  };
  const ensureMeta=(name,content)=>{
    let el=document.head.querySelector(`meta[name="${name}"]`);
    if(!el){el=document.createElement('meta');el.name=name;document.head.appendChild(el)}
    el.content=content;
    return el;
  };
  const loadImage=(src)=>new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
  const buildTransparentIcon=(img,size,paddingRatio=.1)=>{
    const canvas=document.createElement('canvas');
    canvas.width=size;
    canvas.height=size;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    const padding=Math.round(size*paddingRatio);
    const max=size-padding*2;
    const ratio=Math.min(max/img.width,max/img.height);
    const w=Math.round(img.width*ratio);
    const h=Math.round(img.height*ratio);
    const x=Math.round((size-w)/2);
    const y=Math.round((size-h)/2);
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,x,y,w,h);
    return canvas.toDataURL('image/png');
  };

  let icon192=iconSource;
  let icon512=iconSource;
  let icon180=iconSource;
  try{
    const img=await loadImage(iconSource);
    icon192=buildTransparentIcon(img,192,.08);
    icon512=buildTransparentIcon(img,512,.08);
    icon180=buildTransparentIcon(img,180,.08);
  }catch(err){
    console.warn('Icône transparente PWA non générée, utilisation du logo source.', err);
  }

  ensureLink('icon',icon192,'192x192');
  ensureLink('shortcut icon',icon192);
  ensureLink('apple-touch-icon',icon180,'180x180');
  ensureMeta('msapplication-TileImage',icon192);

  const manifest={
    id:currentUrl,
    name:APP_NAME,
    short_name:APP_NAME,
    description:'Application de gestion de budget intelligente.',
    start_url:currentUrl,
    scope:currentScope,
    display:'standalone',
    display_override:['standalone','minimal-ui'],
    orientation:'portrait-primary',
    background_color:'#07070a',
    theme_color:'#07070a',
    icons:[
      {src:icon192,sizes:'192x192',type:'image/png',purpose:'any'},
      {src:icon512,sizes:'512x512',type:'image/png',purpose:'any'}
    ]
  };
  const murl=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));
  let manifestLink=document.head.querySelector('link[rel="manifest"]');
  if(!manifestLink){manifestLink=document.createElement('link');manifestLink.rel='manifest';document.head.appendChild(manifestLink)}

function TxList({rows,setModal,del}){return <div className="list">{rows.length?<><div className="mobileDeleteHint">Reste appuyé sur une ligne pour la supprimer.</div>{rows.map(t=>{const paid=txIsPaid(t);return <LongPressRow className={`tx ${paid?'paidTx':''}`} key={t.id} tx={t} onEdit={(tx)=>setModal({type:'tx',edit:tx})} onDelete={del}>{paid&&<PaidBadge/>}<Icon cat={t.category}/><div><div className="txTitle">{t.title}</div><div className="txMeta">{t.category.name} • {new Date(t.date).toLocaleDateString('fr-FR')}</div></div><AmountBlock tx={t}/><div className="txActions"><button className="btn" onClick={(e)=>{e.stopPropagation();setModal({type:'tx',edit:t})}}>Modifier</button></div></LongPressRow>})}</>:<div className="empty">Aucune transaction pour ce mois.</div>}</div>}
function Icon({cat}){return <div className="txIcon"><ion-icon name={cat.icon} style={{color:cat.color,fontSize:23}}/></div>}
function Budgets({rows,budgets,setBudgets}){const exp=rows.filter(t=>t.type==='expense');const spent=n=>exp.filter(t=>t.category.name===n).reduce((a,t)=>a+ +t.amount,0);return <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>{cats.filter(c=>c.name!=='Revenus').map(c=>{const s=spent(c.name),b=+budgets[c.name]||0,p=b?Math.min(100,s/b*100):0;return <div className="card" key={c.name}><div className="sectionTitle"><h3><ion-icon name={c.icon} style={{color:c.color}}/> {c.name}</h3></div><div className="amount">{money(s)} / {b?money(b):'non défini'}</div><div className="progress" style={{margin:'12px 0'}}><i style={{width:p+'%',background:p>100?'var(--red)':'linear-gradient(90deg,var(--green),var(--gold))'}}/></div><input type="number" placeholder="Budget mensuel" value={budgets[c.name]||''} onChange={e=>setBudgets({...budgets,[c.name]:e.target.value})}/></div>})}</div>}
function Goals({goals,setGoals}){const [name,setName]=useState(''),[target,setTarget]=useState(''),[saved,setSaved]=useState('');const add=()=>{if(!name||!target)return;setGoals([...goals,{id:uid(),name,target:+target,saved:+saved||0}]);setName('');setTarget('');setSaved('')};return <div className="grid"><div className="card"><h3 style={{marginTop:0}}>Nouvel objectif</h3><div className="formGrid"><input placeholder="Nom: vacances, voiture..." value={name} onChange={e=>setName(e.target.value)}/><input type="number" placeholder="Montant cible" value={target} onChange={e=>setTarget(e.target.value)}/><input type="number" placeholder="Déjà mis de côté" value={saved} onChange={e=>setSaved(e.target.value)}/><button className="btn primary" onClick={add}>Créer l’objectif</button></div></div><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>{goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return <div className="card" key={g.id}><div className="sectionTitle"><h3>{g.name}</h3><button className="btn danger" onClick={()=>setGoals(goals.filter(x=>x.id!==g.id))}>Supprimer</button></div><div className="amount gold">{money(g.saved)} / {money(g.target)}</div><div className="progress" style={{margin:'12px 0'}}><i style={{width:p+'%'}}/></div><input type="number" value={g.saved} onChange={e=>setGoals(goals.map(x=>x.id===g.id?{...x,saved:+e.target.value}:x))}/></div>})}</div></div>}
function PairConnectionPanel({sync,notify}){
 const [pairInput,setPairInput]=useState(''),[busy,setBusy]=useState(false);
 const connected=!!sync.user;
 const room=sync.pairRoom;
 const permissionHelp='Firebase refuse la création du code. Mets à jour les règles Firestore : Firebase Console → Firestore Database → Rules, colle les règles PrimeBudget, puis clique sur Publier. Recharge ensuite le site.';
 const errorText=err=>err?.code==='permission-denied'||String(err?.message||'').toLowerCase().includes('permission')?permissionHelp:(err?.message||'Impossible de continuer.');
 const copyRules=async()=>{const ok=await copyText(sync.rules||firestoreRules);notify(ok?'Règles Firestore copiées':'Copie impossible',ok?'Colle ces règles dans Firebase Console → Firestore Database → Rules, puis clique sur Publier.':'Ton navigateur bloque la copie automatique. Va dans Réglages Firebase et copie les règles manuellement.',ok?'success':'danger')};
 const createPair=async()=>{if(busy)return;setBusy(true);try{const result=await sync.createPairRoom({copyPersonal:true});await copyText(result.code);notify('Code à deux créé',`Le code ${result.code} a été copié. Donne-le à l’autre personne : elle verra les mêmes données et chaque modification sera synchronisée.`, 'success')}catch(err){notify('Connexion à deux impossible',errorText(err),'danger')}finally{setBusy(false)}};
 const joinPair=async()=>{if(busy)return;setBusy(true);try{const result=await sync.joinPairRoom(pairInput);setPairInput('');notify('Espace à deux connecté',`Tu es connecté au code ${result.code}. Les données vont maintenant se mettre à jour des deux côtés.`, 'success')}catch(err){notify('Code de connexion invalide',errorText(err),'danger')}finally{setBusy(false)}};
 const copyPair=async()=>{if(!room?.code)return;const ok=await copyText(room.code);notify(ok?'Code copié':'Copie impossible',ok?'Envoie ce code à la personne à connecter.':'Ton navigateur bloque la copie automatique.',ok?'success':'danger')};
 const disconnect=()=>{sync.disconnectPairRoom();notify('Espace à deux déconnecté','Cet appareil n’est plus relié à ce code. Tu peux en créer ou rejoindre un autre.', 'success')};
 return <div className="card pairPanel"><div className="shareHeader"><div><h3>Connexion à deux</h3><p className="mini" style={{margin:'6px 0 0'}}>Ce mode est un deuxième PrimeBudget parallèle. Le budget personnel reste séparé, et ici les deux personnes voient les mêmes données en direct.</p></div><span className={`syncBadge ${room?.id?'shared':''}`}><ion-icon name={room?.id?'people-outline':'person-add-outline'}/>{room?.id?'Connecté à deux':'Non connecté'}</span></div><div className="pairStatus"><div className="pairBox"><b>Compte Google</b><span>{connected?sync.user.email:'Connexion Google obligatoire pour synchroniser.'}</span></div><div className="pairBox"><b>Données partagées</b><span>{room?.id?'Chaque ajout, modification ou suppression se met à jour chez les deux personnes.':'Crée un code pour partager tes données personnelles dans cet espace, ou entre le code reçu.'}</span></div></div>{room?.code&&<div className="shareCodeRow"><div className="shareCodeDisplay">{room.code}</div><button className="btn" onClick={copyPair}><ion-icon name="copy-outline"/>Copier</button></div>}<div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(240px,1fr))'}}><button className="btn primary" onClick={createPair} disabled={busy||!connected}><ion-icon name="people-outline"/>{room?.id?'Créer un nouveau code':'Créer mon code à deux'}</button><button className="btn danger" onClick={disconnect} disabled={!room?.id}><ion-icon name="unlink-outline"/>Déconnecter cet appareil</button></div><div className="field"><label>Entrer le code d’une autre personne</label><div className="shareCodeRow"><input value={pairInput} onChange={e=>setPairInput(e.target.value.toUpperCase())} placeholder="DUO-XXXX-XXXX"/><button className="btn primary" onClick={joinPair} disabled={busy||!connected}><ion-icon name="log-in-outline"/>Connecter</button></div></div></div>
}
function Settings({duplicate,exportAll,importAll,clear,sync,month,rows,shareCode,setShareCode,generateShare,importShare,notify}){const [shareInput,setShareInput]=useState(''),[busy,setBusy]=useState(false);const connected=!!sync.user;const monthLabel=labelMonth(month);const copyCode=async()=>{if(!shareCode)return;const ok=await copyText(shareCode);notify(ok?'Code copié':'Copie impossible',ok?'Le code de partage est prêt à être envoyé.':'Ton navigateur bloque la copie automatique. Sélectionne le code manuellement.',ok?'success':'danger')};const copyRules=async()=>{const ok=await copyText(sync.rules||firestoreRules);notify(ok?'Règles Firestore copiées':'Copie impossible',ok?'Colle ces règles dans Firebase Console → Firestore Database → Rules.':'Ton navigateur bloque la copie automatique.',ok?'success':'danger')};const handleGenerate=async()=>{if(busy)return;setBusy(true);try{await generateShare()}catch{}finally{setBusy(false)}};const handleImport=async()=>{if(busy)return;setBusy(true);try{await importShare(shareInput);setShareInput('')}catch{}finally{setBusy(false)}};return <div className="grid">{sync.mode==='shared'&&<PairConnectionPanel sync={sync} notify={notify}/>}<div className="card"><h3 style={{marginTop:0}}>Réglages & sauvegarde</h3><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}><AuthBar sync={sync} notify={notify}/><button className="btn" onClick={exportAll}><ion-icon name="download-outline"/>Exporter</button><label className="btn"><ion-icon name="cloud-upload-outline"/>Importer<input type="file" accept=".json" hidden onChange={importAll}/></label><button className="btn" onClick={duplicate}><ion-icon name="copy-outline"/>Dupliquer le mois affiché</button><button className="btn danger" onClick={clear}><ion-icon name="trash-outline"/>Réinitialiser</button></div><p className="mini" style={{marginTop:18}}>PrimeBudget est optimisé pour une utilisation fluide sur ordinateur, Android et iOS, avec une installation possible en application PWA.</p></div><div className="card sharePanel"><div className="shareHeader"><div><h3>Partage du mois</h3><p className="mini" style={{margin:'6px 0 0'}}>Génère un code pour copier le mois affiché chez une autre personne connectée avec Google.</p></div><span className="syncBadge"><ion-icon name={connected?'cloud-done-outline':'cloud-offline-outline'}/>{connected?'Connecté':'Connexion Google requise'}</span></div><div className="shareSteps"><div className="shareStep"><b>Mois partagé</b><span>{monthLabel} • {rows.length} transaction(s)</span></div><div className="shareStep"><b>Sécurité</b><span>Le code est enregistré dans Firestore. Sans ce code, personne ne peut récupérer le partage. Les doublons sont ignorés automatiquement à l’import.</span></div></div><button className="btn primary" onClick={handleGenerate} disabled={busy||!connected}><ion-icon name="share-social-outline"/>{busy?'Traitement...':'Générer le code du mois affiché'}</button>{shareCode&&<div className="shareCodeRow"><div className="shareCodeDisplay">{shareCode}</div><button className="btn" onClick={copyCode}><ion-icon name="copy-outline"/>Copier</button></div>}<div className="field"><label>Entrer un code de partage</label><div className="shareCodeRow"><input value={shareInput} onChange={e=>setShareInput(e.target.value.toUpperCase())} placeholder="PB-XXXX-XXXX"/><button className="btn primary" onClick={handleImport} disabled={busy||!connected}><ion-icon name="download-outline"/>Importer</button></div></div></div></div>}
function PaymentUseEditor({editor,total,onClose,onSave}){
 const [step,setStep]=useState(0);
 const [draft,setDraft]=useState(()=>({label:editor?.draft?.label||'',amount:editor?.draft?.amount??'',date:editor?.draft?.date||today()}));
 const isEdit=!!editor?.editId;
 const steps=['Nom','Somme','Date','Enregistrer'];
 const nextLabel=step<3?'Suivant':'Enregistrer';
 const update=(patch)=>setDraft(d=>({...d,...patch}));
 const submit=ev=>{
  ev.preventDefault();
  if(step<3){setStep(v=>v+1);return}
  const amount=clampNumber(draft.amount,0,total||Infinity);
  if(amount<=0)return;
  onSave({...draft,label:String(draft.label||'Paiement').trim(),amount,date:draft.date||today()});
 };
 return <div className="modal nestedPaymentModal" onMouseDown={ev=>{ev.stopPropagation();if(ev.target===ev.currentTarget)onClose()}}><div className="modalBox"><div className="modalHead"><h3>{isEdit?'Modifier une somme':'Ajouter une somme'}</h3><button type="button" className="btn danger" onClick={onClose}><ion-icon name="close-outline"/></button></div><div className="paymentWizardSteps">{steps.map((_,i)=><i key={i} className={i<=step?'active':''}/>)}</div><form onSubmit={submit}>{step===0&&<div className="field"><h4 className="paymentStepTitle">Nom de l’utilisation</h4><p className="paymentStepHelp">Exemple : acompte, facture EDF, courses, mensualité ou paiement CB.</p><label>Nom</label><input required autoFocus value={draft.label} onChange={ev=>update({label:ev.target.value})} placeholder="Ex: Facture déjà réglée"/></div>}{step===1&&<div className="field"><h4 className="paymentStepTitle">Somme déjà payée</h4><p className="paymentStepHelp">Indique uniquement la somme utilisée pour ce paiement.</p><label>Somme</label><input required autoFocus type="number" step="0.01" min="0.01" max={total||undefined} value={draft.amount} onChange={ev=>update({amount:ev.target.value})} placeholder="0,00"/></div>}{step===2&&<div className="field"><h4 className="paymentStepTitle">Date du paiement</h4><p className="paymentStepHelp">Cette date apparaîtra dans l’historique des déjà payés.</p><label>Date</label><input required autoFocus type="date" value={draft.date||today()} onChange={ev=>update({date:ev.target.value})}/></div>}{step===3&&<div><h4 className="paymentStepTitle">Vérification</h4><p className="paymentStepHelp">Tout est prêt. Enregistre pour ajouter cette somme dans l’historique.</p><div className="paymentConfirmCard"><div className="paymentConfirmRow"><span>Nom</span><b>{draft.label||'Paiement'}</b></div><div className="paymentConfirmRow"><span>Somme</span><b>{money(draft.amount)}</b></div><div className="paymentConfirmRow"><span>Date</span><b>{new Date(draft.date||today()).toLocaleDateString('fr-FR')}</b></div></div></div>}<div className="paymentModalActions"><button type="button" className="btn ghost" onClick={step>0?()=>setStep(v=>v-1):onClose}>{step>0?'Retour':'Annuler'}</button><button className="btn primary" type="submit"><ion-icon name={step<3?'arrow-forward-outline':'checkmark-circle-outline'}/>{nextLabel}</button></div></form></div></div>
}
function PaymentHistoryModal({uses,onClose,onEdit,onDelete}){
 const rows=normalizePaymentUses(uses||[],Infinity).sort((a,b)=>new Date(b.date)-new Date(a.date));
 return <div className="modal nestedPaymentModal" onMouseDown={ev=>{ev.stopPropagation();if(ev.target===ev.currentTarget)onClose()}}><div className="modalBox"><div className="modalHead"><h3>Historique des déjà payés</h3><button type="button" className="btn danger" onClick={onClose}><ion-icon name="close-outline"/></button></div>{rows.length?<div className="paymentHistoryList">{rows.map(u=><div className="paymentHistoryRow" key={u.id}><div><div className="paymentHistoryTitle">{u.label||'Paiement'}</div><div className="paymentHistoryMeta"><span>{new Date(u.date||today()).toLocaleDateString('fr-FR')}</span><span>•</span><span>Déjà payé</span></div></div><div><div className="paymentHistoryAmount">{money(u.amount)}</div><div className="paymentHistoryActions"><button type="button" className="btn" onClick={()=>onEdit(u)}><ion-icon name="create-outline"/>Modifier</button><button type="button" className="btn danger" onClick={()=>onDelete(u.id)}><ion-icon name="trash-outline"/>Supprimer</button></div></div></div>)}</div>:<div className="paymentUseEmpty">Aucun paiement enregistré pour cette opération.</div>}</div></div>
}
function TxModal({modal,close,save}){
 const e=modal.edit;
 const isEdit=!!e;
 const initialUses=()=>{
  if(!isEdit||e?.type!=='expense')return [];
  const total=txTotal(e);
  const savedUses=normalizePaymentUses(e?.paymentUses||[],total);
  if(savedUses.length)return savedUses;
  const legacy=clampNumber(e?.paidAmount,0,total);
  return legacy>0?[{id:uid(),label:'Paiement déjà ajouté',amount:legacy,date:e?.date||today()}]:[];
 };
 const [type,setType]=useState(e?.type||'expense'),[cat,setCat]=useState(e?.category?.name||'Alimentation'),[amount,setAmount]=useState(e?.amount??''),[paymentUses,setPaymentUses]=useState(initialUses),[isPaid,setIsPaid]=useState(isEdit?txIsPaid(e||{}):false),[payEditor,setPayEditor]=useState(null),[showHistory,setShowHistory]=useState(false);
 const forceUnpaidRef=useRef(false);
 const chosen=cats.find(c=>c.name===cat)||cats[1];
 const showPaymentControls=isEdit&&type==='expense';
 const total=txTotal({amount});
 const usesTotal=paymentUses.reduce((a,u)=>a+Number(u.amount||0),0);
 const previewPaid=showPaymentControls?(isPaid?total:clampNumber(usesTotal,0,total)):0;
 const previewRemaining=Math.max(0,total-previewPaid);
 const openAddUse=()=>setPayEditor({editId:null,draft:{label:'',amount:'',date:today()}});
 const openEditUse=u=>{setShowHistory(false);setPayEditor({editId:u.id,draft:{label:u.label||'',amount:String(u.amount||''),date:u.date||today()}})};
 const saveUse=draft=>{forceUnpaidRef.current=false;setPaymentUses(list=>{const nextUse={id:payEditor?.editId||uid(),label:String(draft.label||'Paiement').trim(),amount:clampNumber(draft.amount,0,total||Infinity),date:draft.date||today()};const next=normalizePaymentUses(payEditor?.editId?list.map(u=>u.id===payEditor.editId?nextUse:u):[...list,nextUse],total);const nextTotal=next.reduce((a,u)=>a+Number(u.amount||0),0);if(nextTotal<total)setIsPaid(false);return next});setPayEditor(null)};
 const removeUse=id=>{setPaymentUses(list=>{const next=list.filter(u=>u.id!==id);const nextTotal=next.reduce((a,u)=>a+Number(u.amount||0),0);if(nextTotal<total)setIsPaid(false);return next});};
 const togglePaidStatus=()=>setIsPaid(current=>{const next=!current;forceUnpaidRef.current=!next;if(!next){setPaymentUses([]);setPayEditor(null);setShowHistory(false)}return next});
 const changeType=value=>{setType(value);if(value==='income'){forceUnpaidRef.current=true;setCat('Revenus');setIsPaid(false);setPaymentUses([]);setPayEditor(null);setShowHistory(false)}if(value==='expense'&&cat==='Revenus')setCat('Alimentation')};
 return <div className="modal" onMouseDown={ev=>{if(ev.target===ev.currentTarget)close()}}><div className="modalBox"><div className="modalHead"><h3>{e?'Modifier':'Ajouter'} une transaction</h3><button className="btn danger" onClick={close}><ion-icon name="close-outline"/></button></div><form onSubmit={ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);const totalAmount=Math.max(0,Number(f.get('amount')||0));const canEditPayment=!!e&&type==='expense';const forceUnpaid=forceUnpaidRef.current&&!isPaid;const cleanedUses=canEditPayment&&!forceUnpaid?normalizePaymentUses(paymentUses,totalAmount):[];const rawPaid=cleanedUses.reduce((a,u)=>a+Number(u.amount||0),0);const finalPaidStatus=canEditPayment&&!forceUnpaid&&(isPaid||(totalAmount>0&&rawPaid>=totalAmount));const finalPaid=canEditPayment&&!forceUnpaid?(finalPaidStatus?totalAmount:clampNumber(rawPaid,0,totalAmount)):0;save({...e,id:e?.id||uid(),title:f.get('title'),amount:totalAmount,type,category:chosen,date:f.get('date'),note:f.get('note'),paymentUses:forceUnpaid?[]:cleanedUses,paidAmount:finalPaid,isPaid:finalPaidStatus})}}><div className="formGrid"><div className="field"><label>Titre</label><input name="title" required defaultValue={e?.title||''} placeholder="Ex: salaire, courses..." autoFocus/></div><div className="field"><label>Montant</label><input name="amount" type="number" step="0.01" min="0" required value={amount} onChange={ev=>{setAmount(ev.target.value);if(Number(ev.target.value||0)>usesTotal)setIsPaid(false)}}/></div><div className="field"><label>Type</label><select value={type} onChange={ev=>changeType(ev.target.value)}><option value="expense">Dépense</option><option value="income">Revenu</option></select></div><div className="field"><label>Date</label><input name="date" type="date" defaultValue={e?.date||today()}/></div>{showPaymentControls&&<div className="field"><label>Statut</label><button type="button" className={isPaid?'paidToggle active':'paidToggle'} onClick={togglePaidStatus}><span>{isPaid?'Payé':'Non payé'}</span><ion-icon name={isPaid?'checkmark-circle-outline':'ellipse-outline'}/></button></div>}</div>{showPaymentControls&&<div className="paymentSection"><div className="paymentSectionHead"><div><h4>Sommes déjà payées</h4><p>Ajoute chaque paiement proprement avec un nom, une somme et une date.</p></div><div className="paymentActionStack"><button type="button" className="btn primary" onClick={openAddUse}><ion-icon name="add-outline"/>Ajouter une somme</button><button type="button" className="btn" onClick={()=>setShowHistory(true)}><ion-icon name="time-outline"/>Historique des déjà payés</button></div></div><div className="paymentSummaryLine"><span>{paymentUses.length} paiement(s) enregistré(s)</span><b>{money(usesTotal)}</b></div></div>}{showPaymentControls&&<div className="paymentPreview"><div className="paymentBox"><span>Déjà payé</span><b className="gold">{money(previewPaid)}</b></div><div className="paymentBox"><span>Restant utilisable</span><b className={previewRemaining>0?'green':'red'}>{money(previewRemaining)}</b></div></div>}<div className="field" style={{marginTop:12}}><label>Catégorie</label><div className="catGrid">{cats.filter(c=>type==='income'?c.name==='Revenus':c.name!=='Revenus').map(c=><button type="button" key={c.name} className={cat===c.name?'catBtn active':'catBtn'} onClick={()=>setCat(c.name)}><ion-icon name={c.icon} style={{color:c.color,fontSize:22}}/>{c.name}</button>)}</div></div><div className="field" style={{marginTop:12}}><label>Note</label><textarea name="note" rows="3" defaultValue={e?.note||''} placeholder="Optionnel"/></div><button className="btn primary" style={{width:'100%',marginTop:14}}><ion-icon name="checkmark-circle-outline"/>Enregistrer</button></form></div>{payEditor&&<PaymentUseEditor editor={payEditor} total={total} onClose={()=>setPayEditor(null)} onSave={saveUse}/>} {showHistory&&<PaymentHistoryModal uses={paymentUses} onClose={()=>setShowHistory(false)} onEdit={openEditUse} onDelete={removeUse}/>}</div>
}

function AppDialog({dialog,close}){const icon=dialog.kind==='danger'?'warning-outline':dialog.kind==='success'?'checkmark-circle-outline':'information-circle-outline';return <div className="modal" onMouseDown={ev=>{if(ev.target===ev.currentTarget)close()}}><div className="modalBox dialogBox"><div className="modalHead"><h3 className={`dialogTitle ${dialog.kind||''}`}><ion-icon name={icon}/>{dialog.title}</h3><button className="btn ghost" onClick={close}><ion-icon name="close-outline"/></button></div>{dialog.message&&<p className="dialogText">{dialog.message}</p>}<div className="dialogActions">{(dialog.actions||[]).map((action,i)=><button key={i} className={`btn ${action.className||''}`} onClick={action.onClick}>{action.label}</button>)}</div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
