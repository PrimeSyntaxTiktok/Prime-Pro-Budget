function Settings({duplicate,exportAll,importAll,clear,sync}){return <div className="grid"><div className="card"><h3 style={{marginTop:0}}>Réglages & sauvegarde</h3><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}><button className="btn" onClick={duplicate}><ion-icon name="copy-outline"/>Dupliquer le mois affiché</button><button className="btn" onClick={exportAll}><ion-icon name="download-outline"/>Exporter les données</button><label className="btn"><ion-icon name="cloud-upload-outline"/>Importer<input type="file" accept=".json" hidden onChange={importAll}/></label><button className="btn danger" onClick={clear}><ion-icon name="trash-outline"/>Réinitialiser</button></div><p className="mini" style={{marginTop:18}}>Cette application est instalable sur Pc , Android et iOS</p></div><FirebaseSettings sync={sync}/></div>}
function FirebaseSettings({sync}){return <div className="card firebasePanel"><div><h3 style={{margin:'0 0 8px'}}>Compte Google & synchronisation temps réel</h3><p className="mini">Firebase est intégré directement dans ce fichier HTML. Chaque personne peut se connecter avec son propre compte Google ; ses données sont isolées dans Firestore avec son UID.</p></div><div className="syncCard"><div className="syncLine"><i className={`dot ${sync.user?'online':sync.configured?'warn':'err'}`}></i><b>{sync.status}</b></div>{sync.error&&<p className="mini red">{sync.error}</p>}{sync.user&&<p className="mini">Compte connecté : {sync.user.email}</p>}<div className="smallGrid" style={{marginTop:12}}>{sync.configured&&!sync.user&&<button className="btn primary" onClick={sync.signInGoogle}><ion-icon name="logo-google"/>Se connecter avec Google</button>}{sync.user&&<><button className="btn" onClick={()=>sync.pushNow('Envoi manuel...')}><ion-icon name="sync-outline"/>Forcer la synchro</button><button className="btn danger" onClick={sync.signOut}><ion-icon name="log-out-outline"/>Se déconnecter</button></>}{!sync.configured&&<span className="syncBadge"><ion-icon name="warning-outline"/>Configuration Firebase manquante dans le HTML</span>}</div></div><div className="smallGrid"><span className="syncBadge"><ion-icon name="flame-outline"/>Projet : {EMBEDDED_FIREBASE_CONFIG.projectId}</span><span className="syncBadge"><ion-icon name="shield-checkmark-outline"/>Données par compte Google</span><span className="syncBadge"><ion-icon name="flash-outline"/>Synchronisation temps réel</span></div><div><p className="mini"><b>Règles Firestore à coller dans Firebase Console → Firestore Database → Rules :</b></p><pre className="rulesBox">{firestoreRules}</pre></div><p className="mini">À vérifier dans Firebase Console : Authentication → Sign-in method → Google activé, Authorized domains → domaine de ton site ajouté, puis Firestore Database → base créée avec les règles ci-dessus.</p></div>}
function TxModal({modal,close,save}){const e=modal.edit;const [type,setType]=useState(e?.type||'expense'),[cat,setCat]=useState(e?.category?.name||'Alimentation');const chosen=cats.find(c=>c.name===cat)||cats[1];return <div className="modal" onMouseDown={ev=>{if(ev.target.className==='modal')close()}}><div className="modalBox"><div className="modalHead"><h3>{e?'Modifier':'Ajouter'} une transaction</h3><button className="btn danger" onClick={close}><ion-icon name="close-outline"/></button></div><form onSubmit={ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);save({id:e?.id||uid(),title:f.get('title'),amount:+f.get('amount'),type,category:chosen,date:f.get('date'),note:f.get('note')})}}><div className="formGrid"><div className="field"><label>Titre</label><input name="title" required defaultValue={e?.title||''} placeholder="Ex: salaire, courses..." autoFocus/></div><div className="field"><label>Montant</label><input name="amount" type="number" step="0.01" required defaultValue={e?.amount||''}/></div><div className="field"><label>Type</label><select value={type} onChange={ev=>{setType(ev.target.value); if(ev.target.value==='income')setCat('Revenus')}}><option value="expense">Dépense</option><option value="income">Revenu</option></select></div><div className="field"><label>Date</label><input name="date" type="date" defaultValue={e?.date||today()}/></div></div><div className="field" style={{marginTop:12}}><label>Catégorie</label><div className="catGrid">{cats.filter(c=>type==='income'?c.name==='Revenus':c.name!=='Revenus').map(c=><button type="button" key={c.name} className={cat===c.name?'catBtn active':'catBtn'} onClick={()=>setCat(c.name)}><ion-icon name={c.icon} style={{color:c.color,fontSize:22}}/>{c.name}</button>)}</div></div><div className="field" style={{marginTop:12}}><label>Note</label><textarea name="note" rows="3" defaultValue={e?.note||''} placeholder="Optionnel"/></div><button className="btn primary" style={{width:'100%',marginTop:14}}><ion-icon name="checkmark-circle-outline"/>Enregistrer</button></form></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
