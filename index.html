  const ensureLink=(rel,href,sizes='')=>{
    let el=document.head.querySelector(`link[rel="${rel}"]`);
    if(!el){el=document.createElement('link');el.rel=rel;document.head.appendChild(el)}
    if(sizes)el.sizes=sizes;
    el.href=href;
    return el;
  };
  const ensureMeta=(name,content)=>{
    let el=document.head.querySelector(`meta[name="${name}"]`);
    if(!el){el=document.createElement('meta');el.name=name;document.head.appendChild(el)}
    el.content=content;
    return el;
  };
  const loadImage=(src)=>new Promise((resolve,reject)=>{
    const img=new Image();
    img.crossOrigin='anonymous';
    img.onload=()=>resolve(img);
    img.onerror=reject;
    img.src=src;
  });
  const buildTransparentIcon=(img,size,paddingRatio=.1)=>{
    const canvas=document.createElement('canvas');
    canvas.width=size;
    canvas.height=size;
    const ctx=canvas.getContext('2d');
    ctx.clearRect(0,0,size,size);
    const padding=Math.round(size*paddingRatio);
    const max=size-padding*2;
    const ratio=Math.min(max/img.width,max/img.height);
    const w=Math.round(img.width*ratio);
    const h=Math.round(img.height*ratio);
    const x=Math.round((size-w)/2);
    const y=Math.round((size-h)/2);
    ctx.imageSmoothingEnabled=true;
    ctx.imageSmoothingQuality='high';
    ctx.drawImage(img,x,y,w,h);
    return canvas.toDataURL('image/png');
  };

  let icon192=iconSource;
  let icon512=iconSource;
  let icon180=iconSource;
  try{

 const duplicate=()=>{const [y,m]=month.split('-').map(Number);const n=new Date(y,m,1),nk=keyOf(n);const clones=rows.map(t=>({...t,id:uid(),date:`${nk}-${String(new Date(t.date).getDate()).padStart(2,'0')}`}));setTx(x=>sortTx([...clones,...x]));setMonth(nk);refreshUI()};
 const clearAll=()=>ask({title:'Réinitialiser PrimeBudget ?',message:'Toutes les transactions, budgets et objectifs enregistrés sur ce compte seront supprimés de cette application.',confirmLabel:'Réinitialiser',danger:true,onConfirm:()=>{setTx([]);setBudgets({});setGoals([]);setMonth(keyOf(today()));refreshUI();notify('Application réinitialisée','PrimeBudget est prêt pour un nouveau suivi.','success')}});
 const generateShare=async()=>{try{const result=await sync.generateShareCode(month,rows);setShareCode(result.code);await copyText(result.code);notify('Code de partage généré',`Le code ${result.code} a été enregistré dans Firebase et copié. Il partage ${result.count} transaction(s) du mois ${labelMonth(result.monthKey)}.`,'success');return result}catch(err){notify('Partage impossible',err?.message||'Impossible de générer le code de partage.','danger');throw err}};
 const importShare=async(code)=>{try{const shared=await sync.readShareCode(code);const checked=uniqueSharedTransactions(tx,shared.transactions);if(!checked.unique.length){notify('Aucune nouvelle transaction',`Ce code contient ${checked.total} transaction(s), mais elles existent déjà dans ton compte. Aucun doublon n’a été importé.`,'success');return {...shared,imported:0,skipped:checked.skipped}}setTx(x=>sortTx([...checked.unique,...x]));setMonth(shared.monthKey);setQuery('');refreshUI();const skippedText=checked.skipped?` ${checked.skipped} doublon(s) ignoré(s).`:'';notify('Mois partagé importé',`${checked.unique.length} transaction(s) copiée(s) dans ${labelMonth(shared.monthKey)} sur ton compte Google.${skippedText}`,'success');return {...shared,imported:checked.unique.length,skipped:checked.skipped}}catch(err){notify('Import du partage impossible',err?.message||'Le code de partage est invalide ou inaccessible.','danger');throw err}};
 const title={home:'Vue globale',transactions:'Transactions',settings:'Réglages'}[view]||'Vue globale';
 return <div className="app"><aside className="sidebar"><Brand/><Nav view={view} setView={setView}/><div className="sideCard"><b>Synchronisation</b><div className="syncLine"><i className={`dot ${sync.user?'online':sync.configured?'warn':''}`}></i>{sync.status}</div>{sync.user&&<p className="mini">Connecté : {sync.user.email}</p>}</div></aside><main className="content">{install&&!isInstalled&&<div className="installBanner" style={{display:'flex'}}><div><b>Installer PrimeBudget</b><div className="mini">Ajoute l’app sur téléphone ou PC.</div></div><button className="btn primary" onClick={promptInstall}>Installer</button></div>}<div className="topbar"><div className="title"><h2>{title}</h2><div className="syncLine"><i className={`dot ${sync.user?'online':sync.configured?'warn':''}`}></i>{sync.status}{sync.lastSync?` • ${sync.lastSync.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`:''}</div></div><div className="toolbar"><select value={month} onChange={e=>setMonth(e.target.value)}>{months.map(m=><option key={m} value={m}>{labelMonth(m)}</option>)}</select><button className="btn" onClick={exportAll}><ion-icon name="download-outline"/><span className="btnText">Exporter</span></button><AuthBar sync={sync} notify={notify}/><label className="btn"><ion-icon name="cloud-upload-outline"/><span className="btnText">Importer</span><input type="file" accept=".json" onChange={importAll} hidden/></label>{view==='transactions'&&<button className="btn primary hideMobile" onClick={()=>setModal({type:'tx'})}><ion-icon name="add-outline"/>Transaction</button>}</div></div>
 <div className="kpis grid"><Kpi label="Solde" value={money(balance)} icon="wallet-outline" cls={balance>=0?'green':'red'} sub={balance>=0?'Mois positif':'À surveiller'}/><Kpi label="Revenus" value={money(income)} icon="trending-up-outline" cls="green" sub="Entrées du mois"/><Kpi label="Dépenses" value={money(expense)} icon="trending-down-outline" cls="red" sub={`${money(burn)} / jour`}/><Kpi label="Santé budget" value={`${health}%`} icon="pulse-outline" cls={health>=20?'green':health>=0?'gold':'red'} sub={`Épargne: ${money(saving)}`}/></div>
 {view==='home'&&<Home rows={rows} month={month} refreshKey={refreshKey+remoteVersion} setModal={setModal} duplicate={duplicate}/>} {view==='transactions'&&<Transactions rows={filtered} query={query} setQuery={setQuery} setModal={setModal} del={del}/>} {view==='settings'&&<Settings duplicate={duplicate} exportAll={exportAll} importAll={importAll} clear={clearAll} sync={sync} month={month} rows={rows} shareCode={shareCode} setShareCode={setShareCode} generateShare={generateShare} importShare={importShare} notify={notify}/>} </main>{view==='transactions'&&<button className="fab" onClick={()=>setModal({type:'tx'})}><ion-icon name="add-outline"/></button>}<Bottom view={view} setView={setView}/>{modal&&<TxModal modal={modal} close={()=>setModal(null)} save={d=>{modal.edit?updateTx(d):addTx(d);setModal(null)}}/>}{dialog&&<AppDialog dialog={dialog} close={closeDialog}/>}</div>}

function AuthBar({sync,notify}){
 const connected=!!sync.user;
 const handleClick=()=>{if(!sync.configured){notify?.('Firebase indisponible','La configuration Firebase n’est pas intégrée dans ce fichier HTML.','danger');return} connected?sync.signOut():sync.signInGoogle()};
 return <button className={`btn googleBtn ${connected?'connected':'primary'}`} onClick={handleClick} title={connected?`Connecté : ${sync.user.email}`:'Se connecter avec Google'}><ion-icon name="logo-google"/><span>Google</span>{connected&&<i className="googleDot"></i>}</button>
}
function Brand(){return <div className="brand"><img src={APP_LOGO} alt="Logo PrimeBudget"/><div><h1>PrimeBudget</h1><p>Budget intelligent</p></div></div>}
function Nav({view,setView}){return <nav className="nav">{[['home','analytics-outline','Tableau de bord'],['transactions','swap-horizontal-outline','Transactions'],['settings','settings-outline','Réglages']].map(i=><button key={i[0]} onClick={()=>setView(i[0])} className={view===i[0]?'active':''}><ion-icon name={i[1]}/>{i[2]}</button>)}</nav>}
function Bottom(p){return <div className="bottomNav">{[['home','analytics-outline','Accueil'],['transactions','list-outline','Lignes'],['settings','settings-outline','Plus']].map(i=><button key={i[0]} className={p.view===i[0]?'active':''} onClick={()=>p.setView(i[0])}><ion-icon name={i[1]}/>{i[2]}</button>)}</div>}
function Kpi({label,value,icon,cls,sub}){return <div className="card kpi"><ion-icon name={icon}/><small>{label}</small><strong className={cls}>{value}</strong><span>{sub}</span></div>}
function Home({rows,month,refreshKey,setModal,duplicate}){return <div className="mainGrid grid"><div className="card"><div className="sectionTitle"><h3>Évolution du solde</h3><button className="btn" onClick={duplicate}><ion-icon name="copy-outline"/>Dupliquer le mois</button></div><div className="chartBox"><ChartLine rows={rows} month={month} version={refreshKey}/></div></div><div className="card"><div className="sectionTitle"><h3>Répartition des dépenses</h3></div><div className="chartBox"><ChartDonut rows={rows} version={refreshKey}/></div></div></div>}
function Transactions({rows,query,setQuery,setModal,del}){return <div className="card"><div className="sectionTitle"><h3>Toutes les transactions</h3><button className="btn primary" onClick={()=>setModal({type:'tx'})}>Ajouter</button></div><input placeholder="Rechercher une transaction, catégorie, note..." value={query} onChange={e=>setQuery(e.target.value)} style={{marginBottom:14}}/><div className="mobileDeleteHint">Sur téléphone : reste appuyé sur une ligne pour la supprimer avec confirmation.</div><div className="tableWrap"><table><thead><tr><th>Titre</th><th>Catégorie</th><th>Date</th><th>Type</th><th>Montant</th><th>Actions</th></tr></thead><tbody>{rows.map(t=><LongPressRow as="tr" key={t.id} tx={t} onDelete={del}><td><b>{t.title}</b><div className="mini">{t.note}</div></td><td><span className="pill"><ion-icon name={t.category.icon} style={{color:t.category.color}}/>{t.category.name}</span></td><td>{new Date(t.date).toLocaleDateString('fr-FR')}</td><td>{t.type==='income'?'Revenu':'Dépense'}</td><td className={t.type==='income'?'green amount':'red amount'}>{t.type==='income'?'+':'-'} {money(t.amount)}</td><td><button className="btn" onClick={()=>setModal({type:'tx',edit:t})}>Modifier</button> <button className="btn danger" onClick={()=>del(t.id)}>Supprimer</button></td></LongPressRow>)}{!rows.length&&<tr><td colSpan="6"><div className="empty">Aucune transaction.</div></td></tr>}</tbody></table></div></div>}
function TxList({rows,setModal,del}){return <div className="list">{rows.length?<><div className="mobileDeleteHint">Reste appuyé sur une ligne pour la supprimer.</div>{rows.map(t=><LongPressRow className="tx" key={t.id} tx={t} onEdit={(tx)=>setModal({type:'tx',edit:tx})} onDelete={del}><Icon cat={t.category}/><div><div className="txTitle">{t.title}</div><div className="txMeta">{t.category.name} • {new Date(t.date).toLocaleDateString('fr-FR')}</div></div><div className={t.type==='income'?'amount green':'amount red'}>{t.type==='income'?'+':'-'} {money(t.amount)}</div><div className="txActions"><button className="btn" onClick={(e)=>{e.stopPropagation();setModal({type:'tx',edit:t})}}>Modifier</button></div></LongPressRow>)}</>:<div className="empty">Aucune transaction pour ce mois.</div>}</div>}
function Icon({cat}){return <div className="txIcon"><ion-icon name={cat.icon} style={{color:cat.color,fontSize:23}}/></div>}
function Budgets({rows,budgets,setBudgets}){const exp=rows.filter(t=>t.type==='expense');const spent=n=>exp.filter(t=>t.category.name===n).reduce((a,t)=>a+ +t.amount,0);return <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>{cats.filter(c=>c.name!=='Revenus').map(c=>{const s=spent(c.name),b=+budgets[c.name]||0,p=b?Math.min(100,s/b*100):0;return <div className="card" key={c.name}><div className="sectionTitle"><h3><ion-icon name={c.icon} style={{color:c.color}}/> {c.name}</h3></div><div className="amount">{money(s)} / {b?money(b):'non défini'}</div><div className="progress" style={{margin:'12px 0'}}><i style={{width:p+'%',background:p>100?'var(--red)':'linear-gradient(90deg,var(--green),var(--gold))'}}/></div><input type="number" placeholder="Budget mensuel" value={budgets[c.name]||''} onChange={e=>setBudgets({...budgets,[c.name]:e.target.value})}/></div>})}</div>}
function Goals({goals,setGoals}){const [name,setName]=useState(''),[target,setTarget]=useState(''),[saved,setSaved]=useState('');const add=()=>{if(!name||!target)return;setGoals([...goals,{id:uid(),name,target:+target,saved:+saved||0}]);setName('');setTarget('');setSaved('')};return <div className="grid"><div className="card"><h3 style={{marginTop:0}}>Nouvel objectif</h3><div className="formGrid"><input placeholder="Nom: vacances, voiture..." value={name} onChange={e=>setName(e.target.value)}/><input type="number" placeholder="Montant cible" value={target} onChange={e=>setTarget(e.target.value)}/><input type="number" placeholder="Déjà mis de côté" value={saved} onChange={e=>setSaved(e.target.value)}/><button className="btn primary" onClick={add}>Créer l’objectif</button></div></div><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>{goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return <div className="card" key={g.id}><div className="sectionTitle"><h3>{g.name}</h3><button className="btn danger" onClick={()=>setGoals(goals.filter(x=>x.id!==g.id))}>Supprimer</button></div><div className="amount gold">{money(g.saved)} / {money(g.target)}</div><div className="progress" style={{margin:'12px 0'}}><i style={{width:p+'%'}}/></div><input type="number" value={g.saved} onChange={e=>setGoals(goals.map(x=>x.id===g.id?{...x,saved:+e.target.value}:x))}/></div>})}</div></div>}
function Settings({duplicate,exportAll,importAll,clear,sync,month,rows,shareCode,setShareCode,generateShare,importShare,notify}){const [shareInput,setShareInput]=useState(''),[busy,setBusy]=useState(false);const connected=!!sync.user;const monthLabel=labelMonth(month);const copyCode=async()=>{if(!shareCode)return;const ok=await copyText(shareCode);notify(ok?'Code copié':'Copie impossible',ok?'Le code de partage est prêt à être envoyé.':'Ton navigateur bloque la copie automatique. Sélectionne le code manuellement.',ok?'success':'danger')};const copyRules=async()=>{const ok=await copyText(sync.rules||firestoreRules);notify(ok?'Règles Firestore copiées':'Copie impossible',ok?'Colle ces règles dans Firebase Console → Firestore Database → Rules.':'Ton navigateur bloque la copie automatique.',ok?'success':'danger')};const handleGenerate=async()=>{if(busy)return;setBusy(true);try{await generateShare()}catch{}finally{setBusy(false)}};const handleImport=async()=>{if(busy)return;setBusy(true);try{await importShare(shareInput);setShareInput('')}catch{}finally{setBusy(false)}};return <div className="grid"><div className="card"><h3 style={{marginTop:0}}>Réglages & sauvegarde</h3><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}><button className="btn" onClick={duplicate}><ion-icon name="copy-outline"/>Dupliquer le mois affiché</button><button className="btn" onClick={exportAll}><ion-icon name="download-outline"/>Exporter les données</button><label className="btn"><ion-icon name="cloud-upload-outline"/>Importer<input type="file" accept=".json" hidden onChange={importAll}/></label><button className="btn danger" onClick={clear}><ion-icon name="trash-outline"/>Réinitialiser</button></div><p className="mini" style={{marginTop:18}}>PrimeBudget est optimisé pour une utilisation fluide sur ordinateur, Android et iOS, avec une installation possible en application PWA.</p></div><div className="card sharePanel"><div className="shareHeader"><div><h3>Partage du mois</h3><p className="mini" style={{margin:'6px 0 0'}}>Génère un code pour copier le mois affiché chez une autre personne connectée avec Google.</p></div><span className="syncBadge"><ion-icon name={connected?'cloud-done-outline':'cloud-offline-outline'}/>{connected?'Connecté':'Connexion Google requise'}</span></div><div className="shareSteps"><div className="shareStep"><b>Mois partagé</b><span>{monthLabel} • {rows.length} transaction(s)</span></div><div className="shareStep"><b>Sécurité</b><span>Le code est enregistré dans Firestore. Sans ce code, personne ne peut récupérer le partage. Les doublons sont ignorés automatiquement à l’import.</span></div></div><button className="btn primary" onClick={handleGenerate} disabled={busy||!connected}><ion-icon name="share-social-outline"/>{busy?'Traitement...':'Générer le code du mois affiché'}</button>{shareCode&&<div className="shareCodeRow"><div className="shareCodeDisplay">{shareCode}</div><button className="btn" onClick={copyCode}><ion-icon name="copy-outline"/>Copier</button></div>}<div className="field"><label>Entrer un code de partage</label><div className="shareCodeRow"><input value={shareInput} onChange={e=>setShareInput(e.target.value.toUpperCase())} placeholder="PB-XXXX-XXXX"/><button className="btn primary" onClick={handleImport} disabled={busy||!connected}><ion-icon name="download-outline"/>Importer</button></div></div></div></div>}
function TxModal({modal,close,save}){const e=modal.edit;const [type,setType]=useState(e?.type||'expense'),[cat,setCat]=useState(e?.category?.name||'Alimentation');const chosen=cats.find(c=>c.name===cat)||cats[1];return <div className="modal" onMouseDown={ev=>{if(ev.target===ev.currentTarget)close()}}><div className="modalBox"><div className="modalHead"><h3>{e?'Modifier':'Ajouter'} une transaction</h3><button className="btn danger" onClick={close}><ion-icon name="close-outline"/></button></div><form onSubmit={ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);save({id:e?.id||uid(),title:f.get('title'),amount:+f.get('amount'),type,category:chosen,date:f.get('date'),note:f.get('note')})}}><div className="formGrid"><div className="field"><label>Titre</label><input name="title" required defaultValue={e?.title||''} placeholder="Ex: salaire, courses..." autoFocus/></div><div className="field"><label>Montant</label><input name="amount" type="number" step="0.01" required defaultValue={e?.amount||''}/></div><div className="field"><label>Type</label><select value={type} onChange={ev=>{setType(ev.target.value); if(ev.target.value==='income')setCat('Revenus')}}><option value="expense">Dépense</option><option value="income">Revenu</option></select></div><div className="field"><label>Date</label><input name="date" type="date" defaultValue={e?.date||today()}/></div></div><div className="field" style={{marginTop:12}}><label>Catégorie</label><div className="catGrid">{cats.filter(c=>type==='income'?c.name==='Revenus':c.name!=='Revenus').map(c=><button type="button" key={c.name} className={cat===c.name?'catBtn active':'catBtn'} onClick={()=>setCat(c.name)}><ion-icon name={c.icon} style={{color:c.color,fontSize:22}}/>{c.name}</button>)}</div></div><div className="field" style={{marginTop:12}}><label>Note</label><textarea name="note" rows="3" defaultValue={e?.note||''} placeholder="Optionnel"/></div><button className="btn primary" style={{width:'100%',marginTop:14}}><ion-icon name="checkmark-circle-outline"/>Enregistrer</button></form></div></div>}
function AppDialog({dialog,close}){const icon=dialog.kind==='danger'?'warning-outline':dialog.kind==='success'?'checkmark-circle-outline':'information-circle-outline';return <div className="modal" onMouseDown={ev=>{if(ev.target===ev.currentTarget)close()}}><div className="modalBox dialogBox"><div className="modalHead"><h3 className={`dialogTitle ${dialog.kind||''}`}><ion-icon name={icon}/>{dialog.title}</h3><button className="btn ghost" onClick={close}><ion-icon name="close-outline"/></button></div>{dialog.message&&<p className="dialogText">{dialog.message}</p>}<div className="dialogActions">{(dialog.actions||[]).map((action,i)=><button key={i} className={`btn ${action.className||''}`} onClick={action.onClick}>{action.label}</button>)}</div></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
