 const duplicate=()=>{const [y,m]=month.split('-').map(Number);const n=new Date(y,m,1),nk=keyOf(n); const clones=rows.map(t=>({...t,id:uid(),date:`${nk}-${String(new Date(t.date).getDate()).padStart(2,'0')}`}));setTx(x=>sortTx([...clones,...x]));setMonth(nk);refreshUI()};
 const title={home:'Vue globale',transactions:'Transactions',settings:'Réglages'}[view]||'Vue globale';
 return <div className="app"><aside className="sidebar"><Brand/><Nav view={view} setView={setView}/><div className="sideCard"><b>Conseil intelligent</b><p className="mini">{income? balance>=0?`Tu gardes ${Math.round(balance/income*100)}% de tes revenus ce mois-ci.`:'Tes dépenses dépassent tes revenus ce mois-ci. Priorité aux postes variables.':'Ajoute ton revenu pour obtenir une analyse fiable.'}</p></div></aside><main className="content"><div className="installBanner"><div><b>Installer PrimeBudget</b><div className="mini">Ajoute l’app sur téléphone ou PC.</div></div><button className="btn primary" onClick={()=>install?.prompt()}>Installer</button></div><div className="topbar"><div className="title"><h2>{title}</h2></div><div className="toolbar"><select value={month} onChange={e=>setMonth(e.target.value)}>{months.map(m=><option key={m} value={m}>{labelMonth(m)}</option>)}</select><button className="btn" onClick={exportAll}><ion-icon name="download-outline"/><span className="btnText">Exporter</span></button><label className="btn"><ion-icon name="cloud-upload-outline"/><span className="btnText">Importer</span><input type="file" accept=".json" onChange={importAll} hidden/></label>{view==='transactions'&&<button className="btn primary hideMobile" onClick={()=>setModal({type:'tx'})}><ion-icon name="add-outline"/>Transaction</button>}</div></div>
 <div className="kpis grid"><Kpi label="Solde" value={money(balance)} icon="wallet-outline" cls={balance>=0?'green':'red'} sub={balance>=0?'Mois positif':'À surveiller'}/><Kpi label="Revenus" value={money(income)} icon="trending-up-outline" cls="green" sub="Entrées du mois"/><Kpi label="Dépenses" value={money(expense)} icon="trending-down-outline" cls="red" sub={`${money(burn)} / jour`}/><Kpi label="Santé budget" value={`${health}%`} icon="pulse-outline" cls={health>=20?'green':health>=0?'gold':'red'} sub={`Épargne: ${money(saving)}`}/></div>
 {view==='home'&&<Home rows={rows} month={month} refreshKey={refreshKey} setModal={setModal} duplicate={duplicate}/>} {view==='transactions'&&<Transactions rows={filtered} query={query} setQuery={setQuery} setModal={setModal} del={del}/>} {view==='settings'&&<Settings duplicate={duplicate} exportAll={exportAll} importAll={importAll} clear={()=>{if(confirm('Tout supprimer ?')){setTx([]);setBudgets({});setGoals([]);setMonth(keyOf(today()));refreshUI()}}}/>} </main>{view==='transactions'&&<button className="fab" onClick={()=>setModal({type:'tx'})}><ion-icon name="add-outline"/></button>}<Bottom view={view} setView={setView}/>{modal&&<TxModal modal={modal} close={()=>setModal(null)} save={d=>{modal.edit?updateTx(d):addTx(d);setModal(null)}}/>}</div>}
function Brand(){return <div className="brand"><img src="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" alt="Logo PrimeBudget"/><div><h1>PrimeBudget</h1><p>Budget intelligent</p></div></div>}
function Nav({view,setView}){return <nav className="nav">{[['home','analytics-outline','Tableau de bord'],['transactions','swap-horizontal-outline','Transactions'],['settings','settings-outline','Réglages']].map(i=><button key={i[0]} onClick={()=>setView(i[0])} className={view===i[0]?'active':''}><ion-icon name={i[1]}/>{i[2]}</button>)}</nav>}
function Bottom(p){return <div className="bottomNav">{[['home','analytics-outline','Accueil'],['transactions','list-outline','Lignes'],['settings','settings-outline','Plus']].map(i=><button key={i[0]} className={p.view===i[0]?'active':''} onClick={()=>p.setView(i[0])}><ion-icon name={i[1]}/>{i[2]}</button>)}</div>}
function Kpi({label,value,icon,cls,sub}){return <div className="card kpi"><ion-icon name={icon}/><small>{label}</small><strong className={cls}>{value}</strong><span>{sub}</span></div>}
function Home({rows,month,refreshKey,setModal,duplicate}){return <div className="mainGrid grid"><div className="card"><div className="sectionTitle"><h3>Évolution du solde</h3><button className="btn" onClick={duplicate}><ion-icon name="copy-outline"/>Dupliquer le mois</button></div><div className="chartBox"><ChartLine rows={rows} month={month} version={refreshKey}/></div></div><div className="card"><div className="sectionTitle"><h3>Répartition des dépenses</h3></div><div className="chartBox"><ChartDonut rows={rows} version={refreshKey}/></div></div></div>}
function Transactions({rows,query,setQuery,setModal,del}){return <div className="card"><div className="sectionTitle"><h3>Toutes les transactions</h3><button className="btn primary" onClick={()=>setModal({type:'tx'})}>Ajouter</button></div><input placeholder="Rechercher une transaction, catégorie, note..." value={query} onChange={e=>setQuery(e.target.value)} style={{marginBottom:14}}/><div className="mobileDeleteHint">Sur téléphone : reste appuyé sur une ligne pour la supprimer avec confirmation.</div><div className="tableWrap"><table><thead><tr><th>Titre</th><th>Catégorie</th><th>Date</th><th>Type</th><th>Montant</th><th>Actions</th></tr></thead><tbody>{rows.map(t=><LongPressRow as="tr" key={t.id} tx={t} onDelete={del}><td><b>{t.title}</b><div className="mini">{t.note}</div></td><td><span className="pill"><ion-icon name={t.category.icon} style={{color:t.category.color}}/>{t.category.name}</span></td><td>{new Date(t.date).toLocaleDateString('fr-FR')}</td><td>{t.type==='income'?'Revenu':'Dépense'}</td><td className={t.type==='income'?'green amount':'red amount'}>{t.type==='income'?'+':'-'} {money(t.amount)}</td><td><button className="btn" onClick={()=>setModal({type:'tx',edit:t})}>Modifier</button> <button className="btn danger" onClick={()=>del(t.id)}>Supprimer</button></td></LongPressRow>)}{!rows.length&&<tr><td colSpan="6"><div className="empty">Aucune transaction.</div></td></tr>}</tbody></table></div></div>}
function TxList({rows,setModal,del}){return <div className="list">{rows.length?<><div className="mobileDeleteHint">Reste appuyé sur une ligne pour la supprimer.</div>{rows.map(t=><LongPressRow className="tx" key={t.id} tx={t} onEdit={(tx)=>setModal({type:'tx',edit:tx})} onDelete={del}><Icon cat={t.category}/><div><div className="txTitle">{t.title}</div><div className="txMeta">{t.category.name} • {new Date(t.date).toLocaleDateString('fr-FR')}</div></div><div className={t.type==='income'?'amount green':'amount red'}>{t.type==='income'?'+':'-'} {money(t.amount)}</div><div className="txActions"><button className="btn" onClick={(e)=>{e.stopPropagation();setModal({type:'tx',edit:t})}}>Modifier</button></div></LongPressRow>)}</>:<div className="empty">Aucune transaction pour ce mois.</div>}</div>}
function Icon({cat}){return <div className="txIcon"><ion-icon name={cat.icon} style={{color:cat.color,fontSize:23}}/></div>}
function Budgets({rows,budgets,setBudgets}){const exp=rows.filter(t=>t.type==='expense');const spent=n=>exp.filter(t=>t.category.name===n).reduce((a,t)=>a+ +t.amount,0);return <div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>{cats.filter(c=>c.name!=='Revenus').map(c=>{const s=spent(c.name),b=+budgets[c.name]||0,p=b?Math.min(100,s/b*100):0;return <div className="card" key={c.name}><div className="sectionTitle"><h3><ion-icon name={c.icon} style={{color:c.color}}/> {c.name}</h3></div><div className="amount">{money(s)} / {b?money(b):'non défini'}</div><div className="progress" style={{margin:'12px 0'}}><i style={{width:p+'%',background:p>100?'var(--red)':'linear-gradient(90deg,var(--green),var(--gold))'}}/></div><input type="number" placeholder="Budget mensuel" value={budgets[c.name]||''} onChange={e=>setBudgets({...budgets,[c.name]:e.target.value})}/></div>})}</div>}
function Goals({goals,setGoals}){const [name,setName]=useState(''),[target,setTarget]=useState(''),[saved,setSaved]=useState('');const add=()=>{if(!name||!target)return;setGoals([...goals,{id:uid(),name,target:+target,saved:+saved||0}]);setName('');setTarget('');setSaved('')};return <div className="grid"><div className="card"><h3 style={{marginTop:0}}>Nouvel objectif</h3><div className="formGrid"><input placeholder="Nom: vacances, voiture..." value={name} onChange={e=>setName(e.target.value)}/><input type="number" placeholder="Montant cible" value={target} onChange={e=>setTarget(e.target.value)}/><input type="number" placeholder="Déjà mis de côté" value={saved} onChange={e=>setSaved(e.target.value)}/><button className="btn primary" onClick={add}>Créer l’objectif</button></div></div><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(260px,1fr))'}}>{goals.map(g=>{const p=Math.min(100,g.saved/g.target*100);return <div className="card" key={g.id}><div className="sectionTitle"><h3>{g.name}</h3><button className="btn danger" onClick={()=>setGoals(goals.filter(x=>x.id!==g.id))}>Supprimer</button></div><div className="amount gold">{money(g.saved)} / {money(g.target)}</div><div className="progress" style={{margin:'12px 0'}}><i style={{width:p+'%'}}/></div><input type="number" value={g.saved} onChange={e=>setGoals(goals.map(x=>x.id===g.id?{...x,saved:+e.target.value}:x))}/></div>})}</div></div>}
function Settings({duplicate,exportAll,importAll,clear}){return <div className="card"><h3 style={{marginTop:0}}>Réglages & sauvegarde</h3><div className="grid" style={{gridTemplateColumns:'repeat(auto-fit,minmax(220px,1fr))'}}><button className="btn" onClick={duplicate}><ion-icon name="copy-outline"/>Dupliquer le mois affiché</button><button className="btn" onClick={exportAll}><ion-icon name="download-outline"/>Exporter les données</button><label className="btn"><ion-icon name="cloud-upload-outline"/>Importer<input type="file" accept=".json" hidden onChange={importAll}/></label><button className="btn danger" onClick={clear}><ion-icon name="trash-outline"/>Réinitialiser</button></div><p className="mini" style={{marginTop:18}}>Cette application est instalable sur Pc , Android et iOS</p></div>}
function TxModal({modal,close,save}){const e=modal.edit;const [type,setType]=useState(e?.type||'expense'),[cat,setCat]=useState(e?.category?.name||'Alimentation');const chosen=cats.find(c=>c.name===cat)||cats[1];return <div className="modal" onMouseDown={ev=>{if(ev.target.className==='modal')close()}}><div className="modalBox"><div className="modalHead"><h3>{e?'Modifier':'Ajouter'} une transaction</h3><button className="btn danger" onClick={close}><ion-icon name="close-outline"/></button></div><form onSubmit={ev=>{ev.preventDefault();const f=new FormData(ev.currentTarget);save({id:e?.id||uid(),title:f.get('title'),amount:+f.get('amount'),type,category:chosen,date:f.get('date'),note:f.get('note')})}}><div className="formGrid"><div className="field"><label>Titre</label><input name="title" required defaultValue={e?.title||''} placeholder="Ex: salaire, courses..." autoFocus/></div><div className="field"><label>Montant</label><input name="amount" type="number" step="0.01" required defaultValue={e?.amount||''}/></div><div className="field"><label>Type</label><select value={type} onChange={ev=>{setType(ev.target.value); if(ev.target.value==='income')setCat('Revenus')}}><option value="expense">Dépense</option><option value="income">Revenu</option></select></div><div className="field"><label>Date</label><input name="date" type="date" defaultValue={e?.date||today()}/></div></div><div className="field" style={{marginTop:12}}><label>Catégorie</label><div className="catGrid">{cats.filter(c=>type==='income'?c.name==='Revenus':c.name!=='Revenus').map(c=><button type="button" key={c.name} className={cat===c.name?'catBtn active':'catBtn'} onClick={()=>setCat(c.name)}><ion-icon name={c.icon} style={{color:c.color,fontSize:22}}/>{c.name}</button>)}</div></div><div className="field" style={{marginTop:12}}><label>Note</label><textarea name="note" rows="3" defaultValue={e?.note||''} placeholder="Optionnel"/></div><button className="btn primary" style={{width:'100%',marginTop:14}}><ion-icon name="checkmark-circle-outline"/>Enregistrer</button></form></div></div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
