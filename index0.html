<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>PrimeBudget</title>
  <meta name="description" content="PrimeBudget - application de gestion de budget intelligente, rapide et installable." />
  <meta name="theme-color" content="#071322" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="application-name" content="PrimeBudget" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-title" content="PrimeBudget" />
  <meta name="apple-mobile-web-app-title" content="PrimeBudget" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="msapplication-TileColor" content="#07070a" />
  <meta name="msapplication-TileImage" content="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="icon" type="image/png" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="shortcut icon" type="image/png" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.ibb.co/zWQXGQK0/a471dbe4979d.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/react@18.2.0/umd/react.production.min.js"></script>
  <script>window.React||document.write('<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"><\/script>')</script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
  <script>window.ReactDOM||document.write('<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>')</script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script>window.Chart||document.write('<script src="https://unpkg.com/chart.js@4.4.9/dist/chart.umd.js"><\/script>')</script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-analytics-compat.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <style>
    :root{
      /* Surfaces obsidiennes */
      --bg:#06060a;--bg2:#0a0a12;--panel:#101019;--panel2:#15151f;--panel3:#1c1c29;
      --text:#f6f7fb;--muted:#9a9bb0;--soft:#6f7088;
      /* Accents */
      --gold:#f6cf6b;--gold2:#d8a52f;--goldsoft:#fbe3a6;
      --green:#34e2a4;--red:#ff5573;--blue:#7fb4ff;--purple:#b29bff;
      --line:rgba(255,255,255,.085);--line2:rgba(255,255,255,.05);
      /* Mélanges */
      --glass:linear-gradient(165deg,rgba(255,255,255,.07),rgba(255,255,255,.022));
      --glass-strong:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.035));
      --gold-grad:linear-gradient(135deg,var(--goldsoft),var(--gold) 42%,var(--gold2));
      --shadow:0 30px 90px -30px rgba(0,0,0,.7);
      --shadow-sm:0 12px 34px -14px rgba(0,0,0,.6);
      --glow-gold:0 0 0 1px rgba(246,207,107,.35),0 20px 55px -18px rgba(246,207,107,.45);
      --radius:24px;--radius-sm:16px;
      --safe-bottom:env(safe-area-inset-bottom,0px);--safe-top:env(safe-area-inset-top,0px);
      --font-display:'Sora',system-ui,sans-serif;
      --font-body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
      --font-mono:'JetBrains Mono',ui-monospace,monospace;
      --ease:cubic-bezier(.22,1,.36,1);
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body,#root{height:100%;margin:0}
    body{
      font-family:var(--font-body);background:var(--bg);color:var(--text);
      overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
      letter-spacing:-.01em;
    }
    /* Aurora vivante + lueurs profondes (sous le contenu) */
    body:before{
      content:"";position:fixed;inset:-25%;z-index:-2;pointer-events:none;
      background:
        radial-gradient(38% 42% at 18% 8%,rgba(246,207,107,.22),transparent 60%),
        radial-gradient(34% 40% at 92% 16%,rgba(127,180,255,.16),transparent 60%),
        radial-gradient(40% 44% at 78% 92%,rgba(52,226,164,.13),transparent 60%),
        radial-gradient(46% 50% at 30% 96%,rgba(178,155,255,.12),transparent 62%);
      filter:blur(28px);
      animation:auroraDrift 26s ease-in-out infinite alternate;
    }
    /* Trame fine + voile texturé */
    body:after{
      content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;
      background-image:
        linear-gradient(to right,rgba(255,255,255,.025) 1px,transparent 1px),
        linear-gradient(to bottom,rgba(255,255,255,.025) 1px,transparent 1px);
      background-size:44px 44px;
      mask-image:radial-gradient(circle at 50% 0%,#000,transparent 78%);
      -webkit-mask-image:radial-gradient(circle at 50% 0%,#000,transparent 78%);
    }

    button,input,select,textarea{font:inherit;font-family:var(--font-body)}
    button{border:0;color:inherit;cursor:pointer}
    input,select,textarea{
      width:100%;border:1px solid var(--line);background:rgba(255,255,255,.045);
      color:var(--text);border-radius:var(--radius-sm);padding:13px 14px;outline:none;
      transition:border-color .25s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease);
    }
    input::placeholder,textarea::placeholder{color:var(--soft)}
    input:focus,select:focus,textarea:focus{
      border-color:rgba(246,207,107,.6);background:rgba(255,255,255,.06);
      box-shadow:0 0 0 4px rgba(246,207,107,.13),0 8px 30px -12px rgba(246,207,107,.4);
    }
    select option{background:#0e0e16;color:#fff}

    /* ============ Coque applicative ============ */
    .app{position:relative;height:100%;display:grid;grid-template-columns:300px 1fr;overflow:hidden}
    .sidebar{
      padding:24px;height:100%;border-right:1px solid var(--line);
      background:linear-gradient(180deg,rgba(12,12,20,.82),rgba(8,8,14,.78));
      backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);
      display:flex;flex-direction:column;gap:20px;position:relative;
    }
    .sidebar:after{content:"";position:absolute;top:0;right:0;width:1px;height:100%;
      background:linear-gradient(180deg,transparent,rgba(246,207,107,.35),transparent)}
    .brand{display:flex;align-items:center;gap:13px}
    .brand img{
      width:48px;height:48px;border-radius:16px;object-fit:cover;
      box-shadow:0 0 0 1px rgba(246,207,107,.5),0 14px 40px -10px rgba(246,207,107,.4);
    }
    .brand h1{margin:0;font-family:var(--font-display);font-size:22px;font-weight:800;letter-spacing:-.04em}
    .brand p{margin:2px 0 0;color:var(--muted);font-size:12px;font-weight:600}

    .nav{display:flex;flex-direction:column;gap:7px}
    .nav button{
      position:relative;background:transparent;border-radius:16px;padding:13px 15px;
      display:flex;align-items:center;gap:13px;color:var(--muted);font-weight:700;
      text-align:left;overflow:hidden;transition:color .25s var(--ease),background .3s var(--ease),transform .2s var(--ease);
    }
    .nav button:before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%) scaleY(0);
      width:3px;height:60%;border-radius:0 4px 4px 0;background:var(--gold-grad);transition:transform .3s var(--ease)}
    .nav button.active,.nav button:hover{
      background:linear-gradient(135deg,rgba(246,207,107,.16),rgba(255,255,255,.035));color:#fff;
    }
    .nav button.active:before{transform:translateY(-50%) scaleY(1)}
    .nav button:hover{transform:translateX(2px)}
    .nav ion-icon{font-size:21px;color:var(--gold);transition:transform .25s var(--ease)}
    .nav button:hover ion-icon{transform:scale(1.12)}

    .sideCard{
      margin-top:auto;border:1px solid var(--line);background:var(--glass);
      border-radius:22px;padding:17px;position:relative;overflow:hidden;
    }
    .sideCard:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(160deg,rgba(246,207,107,.4),transparent 55%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .sideCard b{font-family:var(--font-display);font-weight:700}

    .content{height:100%;overflow:auto;padding:28px 30px 110px;scroll-behavior:smooth}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:24px}
    .title h2{font-family:var(--font-display);font-size:34px;font-weight:800;letter-spacing:-.05em;margin:0;
      background:linear-gradient(120deg,#fff,#cfd0df);-webkit-background-clip:text;background-clip:text;color:transparent}
    .title p{margin:8px 0 0;color:var(--muted)}
    .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

    /* ============ Boutons ============ */
    .btn{
      position:relative;border-radius:var(--radius-sm);padding:12px 16px;font-weight:800;font-size:14px;
      background:var(--glass);border:1px solid var(--line);color:var(--text);
      display:inline-flex;align-items:center;justify-content:center;gap:8px;letter-spacing:-.01em;
      transition:transform .18s var(--ease),box-shadow .25s var(--ease),background .25s var(--ease),border-color .25s var(--ease);
    }
    .btn ion-icon{font-size:18px}
    .btn:hover{transform:translateY(-2px);background:var(--glass-strong);border-color:rgba(255,255,255,.16)}
    .btn:active{transform:translateY(0) scale(.98)}
    .btn.primary{
      background:var(--gold-grad);color:#120d02;border:0;
      box-shadow:var(--glow-gold);text-shadow:0 1px 0 rgba(255,255,255,.25);
    }
    .btn.primary:hover{box-shadow:0 0 0 1px rgba(246,207,107,.5),0 26px 60px -16px rgba(246,207,107,.6);filter:brightness(1.05)}
    .btn.danger{color:var(--red);background:rgba(255,85,115,.1);border-color:rgba(255,85,115,.25)}
    .btn.danger:hover{background:rgba(255,85,115,.16);border-color:rgba(255,85,115,.45)}
    .btn.ghost{background:rgba(255,255,255,.05);color:var(--text)}

    /* ============ Grilles & cartes ============ */
    .grid{display:grid;gap:16px}
    .kpis{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
    .card{
      position:relative;border:1px solid var(--line);background:var(--glass);
      border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;overflow:hidden;
      animation:rise .6s var(--ease) both;
    }
    .card:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(150deg,rgba(255,255,255,.22),transparent 40%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .kpis .kpi:nth-child(1){animation-delay:.04s}
    .kpis .kpi:nth-child(2){animation-delay:.1s}
    .kpis .kpi:nth-child(3){animation-delay:.16s}
    .kpis .kpi:nth-child(4){animation-delay:.22s}

    .kpi{position:relative;min-height:128px;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
    .kpi:after{content:"";position:absolute;left:0;top:0;height:3px;width:100%;
      background:linear-gradient(90deg,var(--gold),transparent 70%);opacity:.7}
    .kpi:hover{transform:translateY(-4px);box-shadow:0 36px 80px -28px rgba(0,0,0,.8)}
    .kpi small{color:var(--muted);font-weight:800;text-transform:uppercase;font-size:11px;letter-spacing:.1em}
    .kpi strong{display:block;font-family:var(--font-display);font-size:28px;font-weight:800;letter-spacing:-.045em;margin-top:11px}
    .kpi span{color:var(--muted);font-size:13px;font-weight:600}
    .kpi ion-icon{position:absolute;right:16px;top:16px;font-size:26px;opacity:.55;
      padding:9px;border-radius:13px;background:rgba(255,255,255,.05);border:1px solid var(--line)}

    .mainGrid{grid-template-columns:1.35fr .65fr}
    .sectionTitle{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 16px}
    .sectionTitle h3{margin:0;font-family:var(--font-display);font-size:18px;font-weight:700;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
    .chartBox{height:292px}

    .tabs{display:flex;gap:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:5px}
    .tabs button{border-radius:13px;background:transparent;color:var(--muted);padding:10px 13px;font-weight:800;transition:all .25s var(--ease)}
    .tabs button.active{background:rgba(255,255,255,.1);color:#fff}

    .progress{height:11px;background:rgba(255,255,255,.07);border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
    .progress i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--green),var(--gold));width:0;
      box-shadow:0 0 14px rgba(52,226,164,.5);transition:width .6s var(--ease)}

    /* ============ Listes & transactions ============ */
    .list{display:flex;flex-direction:column;gap:10px}
    .tx{
      display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:13px;
      border-radius:18px;background:rgba(255,255,255,.04);border:1px solid var(--line2);
      user-select:none;touch-action:manipulation;transition:transform .2s var(--ease),background .25s var(--ease),border-color .25s var(--ease);
    }
    .tx:hover{background:rgba(255,255,255,.06);border-color:var(--line);transform:translateX(2px)}
    .tx.longPressing{border-color:rgba(255,85,115,.65);background:rgba(255,85,115,.1);transform:scale(.995)}
    .txIcon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}
    .txTitle{font-weight:800}
    .txMeta{font-size:12px;color:var(--muted);margin-top:3px}
    .amount{font-family:var(--font-mono);font-weight:800;letter-spacing:-.02em}
    .green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.gold{color:var(--gold)}

    .tableWrap{overflow:auto;border-radius:20px;border:1px solid var(--line)}
    table{width:100%;border-collapse:collapse;min-width:760px}
    th,td{padding:15px;text-align:left;border-bottom:1px solid var(--line2)}
    th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    td{color:#e9e9f1}
    tbody tr{transition:background .2s var(--ease)}
    tbody tr:hover{background:rgba(255,255,255,.035)}
    .pill{display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border-radius:999px;
      background:rgba(255,255,255,.06);border:1px solid var(--line);font-size:12px;font-weight:800}
    .pill ion-icon{font-size:15px}

    /* ============ FAB & navigation mobile ============ */
    .fab{
      display:none;position:fixed;right:18px;bottom:calc(82px + var(--safe-bottom));z-index:20;
      width:58px;height:58px;border-radius:22px;background:var(--gold-grad);color:#120d02;
      box-shadow:0 22px 60px -16px rgba(246,207,107,.6);font-size:28px;
      transition:transform .25s var(--ease);
    }
    .fab:before{content:"";position:absolute;inset:-6px;border-radius:26px;border:1px solid rgba(246,207,107,.4);
      animation:fabPulse 2.6s ease-out infinite}
    .fab:active{transform:scale(.92)}
    .bottomNav{display:none}

    /* ============ Modales ============ */
    .modal{position:fixed;inset:0;z-index:50;background:rgba(4,4,8,.66);
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-items:center;padding:18px;
      animation:fadeIn .25s var(--ease) both}
    .modalBox{
      position:relative;width:min(620px,100%);max-height:90vh;overflow:auto;
      background:linear-gradient(180deg,rgba(22,22,32,.98),rgba(12,12,18,.98));
      border:1px solid var(--line);border-radius:30px;box-shadow:var(--shadow);padding:22px;
      animation:popIn .4s var(--ease) both;
    }
    .modalBox:before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;
      background:linear-gradient(150deg,rgba(246,207,107,.4),transparent 45%);
      -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
      -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
    .modalHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
    .modalHead h3{margin:0;font-family:var(--font-display);font-size:23px;font-weight:700;letter-spacing:-.03em}
    .formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .field{display:flex;flex-direction:column;gap:7px}
    .field label{font-size:11px;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .catGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .catBtn{padding:12px 8px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);
      display:flex;flex-direction:column;gap:6px;align-items:center;font-size:11px;font-weight:800;color:var(--muted);
      transition:transform .2s var(--ease),background .25s var(--ease),border-color .25s var(--ease)}
    .catBtn:hover{transform:translateY(-2px);background:rgba(255,255,255,.07)}
    .catBtn.active{background:rgba(246,207,107,.15);border-color:rgba(246,207,107,.5);color:#fff;box-shadow:0 0 0 1px rgba(246,207,107,.25)}
    .empty{text-align:center;color:var(--muted);padding:38px;font-weight:600}
    .installBanner{
      display:none;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;
      margin:-8px 0 18px;padding:13px 14px;border:1px solid rgba(246,207,107,.28);
      background:linear-gradient(135deg,rgba(246,207,107,.14),rgba(255,255,255,.03));border-radius:19px;
      box-shadow:var(--shadow-sm);
    }
    .installBanner b{font-family:var(--font-display)}
    .mini{font-size:12px;color:var(--muted)}
    .mobileDeleteHint{display:none;margin-top:10px;color:var(--muted);font-size:12px}
    .mobileOnly{display:none}

    /* ============ Scrollbars ============ */
    *{scrollbar-width:thin;scrollbar-color:rgba(246,207,107,.7) rgba(255,255,255,.05)}
    ::-webkit-scrollbar{width:10px;height:10px}
    ::-webkit-scrollbar-track{background:rgba(255,255,255,.04);border-radius:999px}
    ::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:999px;border:2px solid rgba(8,8,14,.9)}
    ::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#ffe89a,var(--gold2))}
    ::-webkit-scrollbar-corner{background:transparent}

    /* ============ Dialogue ============ */
    .dialogBox{width:min(480px,100%);background:linear-gradient(180deg,rgba(30,30,44,.98),rgba(12,12,18,.98));border-color:rgba(246,207,107,.22)}
    .dialogTitle{display:flex;align-items:center;gap:10px;font-family:var(--font-display)}
    .dialogTitle ion-icon{font-size:24px;color:var(--gold)}
    .dialogTitle.danger ion-icon{color:var(--red)}.dialogTitle.success ion-icon{color:var(--green)}
    .dialogText{margin:0;color:var(--muted);line-height:1.55;font-size:14px}
    .dialogActions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;margin-top:22px}
    .dialogActions .btn{min-width:118px}

    /* ============ Auth & synchronisation ============ */
    .authBox{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .authUser{display:flex;align-items:center;gap:9px;padding:9px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(255,255,255,.05);max-width:280px}
    .authUser img{width:28px;height:28px;border-radius:50%;object-fit:cover}
    .authUser span{font-size:12px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
    .googleBtn{min-width:112px;position:relative}
    .googleBtn.connected{background:rgba(52,226,164,.1);border-color:rgba(52,226,164,.3);color:#fff}
    .googleBtn .googleDot{width:8px;height:8px;border-radius:999px;background:var(--green);box-shadow:0 0 0 4px rgba(52,226,164,.15),0 0 12px rgba(52,226,164,.6)}
    .syncLine{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:8px;font-weight:600}
    .dot{width:9px;height:9px;border-radius:50%;background:var(--soft);box-shadow:0 0 0 4px rgba(255,255,255,.035)}
    .dot.online{background:var(--green);box-shadow:0 0 0 4px rgba(52,226,164,.13),0 0 10px rgba(52,226,164,.6);animation:dotPulse 2.4s ease-in-out infinite}
    .dot.warn{background:var(--gold);box-shadow:0 0 0 4px rgba(246,207,107,.13)}
    .dot.err{background:var(--red);box-shadow:0 0 0 4px rgba(255,85,115,.13)}
    .dot.syncing{position:relative}
